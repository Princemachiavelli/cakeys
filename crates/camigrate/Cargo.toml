[package]
name = "camigrate"
description = "Move keys between PKCS#11 tokens, checked against keys.lock (cakeys)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "camigrate"

[[bin]]
name = "camigrate"
path = "src/main.rs"

[features]
default = ["tpm2", "ykcs11"]
tpm2 = ["cakeys-cli-common/tpm2"]
ykcs11 = ["cakeys-cli-common/ykcs11"]
# RFC 5649 key wrap under CKM_AES_KEY_WRAP_KWP (kryoptic names it so; SoftHSM names it _PAD,
# which every build has). Needs the patched cryptoki of the Nix build (nix/patches), which names
# the mechanism: a plain cargo build has no such constant, and plans without it (the unpatched
# binding layer subtracts it).
kwp = []

[dependencies]
cakeys-cli-common = { workspace = true, default-features = false }
cakeys-core.workspace = true
cakeys-pkcs11.workspace = true
cakeys-profile.workspace = true
anyhow.workspace = true
cryptoki.workspace = true
rsa.workspace = true
x509-cert.workspace = true
base64.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# The integration tests include crates/cli/tests/common (one harness for every tool), and with
# it its dependencies.
[dev-dependencies]
proptest.workspace = true
aes.workspace = true
aes-kw.workspace = true
cmac.workspace = true
sha2.workspace = true
