[package]
name = "camigrate"
description = "Move keys between PKCS#11 tokens, checked against keys.lock (cakeys)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "camigrate"

[[bin]]
name = "camigrate"
path = "src/main.rs"

[features]
default = ["tpm2", "ykcs11"]
# The fuzz targets' entry points (fuzz/): never in the product (review D8).
fuzzing = []
tpm2 = ["cakeys-cli-common/tpm2"]
ykcs11 = ["cakeys-cli-common/ykcs11"]
# RFC 5649 key wrap under CKM_AES_KEY_WRAP_KWP (kryoptic names it so; SoftHSM names it _PAD,
# which every build has). Needs the patched cryptoki of the Nix build (nix/patches), which names
# the mechanism: a plain cargo build has no such constant, and plans without it (the unpatched
# binding layer subtracts it).
kwp = []
# Everything the patched cryptoki of the Nix build (nix/patches) makes possible, together: the
# build that links it names this one feature, never the parts by hand (review D3).
patched-cryptoki = ["kwp", "cakeys-pkcs11/rv-value"]

[dependencies]
cakeys-cli-common.workspace = true
cakeys-core.workspace = true
cakeys-pkcs11.workspace = true
cakeys-profile.workspace = true
anyhow.workspace = true
cryptoki.workspace = true
rsa.workspace = true
x509-cert.workspace = true
base64.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
pkcs8.workspace = true
pkcs12.workspace = true
der.workspace = true
zeroize.workspace = true
getrandom.workspace = true
sha2.workspace = true
hmac.workspace = true

# The integration tests include crates/cli/tests/common (one harness for every tool), and with
# it its dependencies.
[dev-dependencies]
proptest.workspace = true
aes.workspace = true
aes-kw.workspace = true
cmac.workspace = true
des.workspace = true
libc.workspace = true
# tests/fault.rs loads its cdylib: as a dependency, every build of the tests makes it.
p11-fault = { path = "../p11-fault" }
