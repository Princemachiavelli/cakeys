[package]
name = "cakeys-pkcs11"
description = "cakeys: PKCS#11 backend, verbs, and the Provider trait for module-specific behaviour"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cakeys-core.workspace = true
cakeys-profile.workspace = true
cryptoki.workspace = true
cryptoki-sys.workspace = true
zeroize.workspace = true
der.workspace = true
aes-kw.workspace = true
libc.workspace = true
getrandom.workspace = true
rsa.workspace = true
x509-cert.workspace = true

[dev-dependencies]
toml.workspace = true

[features]
# The single-part C_Sign after C_SignInit (Session::sign_initialized) a CKA_ALWAYS_AUTHENTICATE
# key's per-use login needs. Needs the patched cryptoki of the Nix build (nix/patches): without
# it, such a key cannot prove possession, and the proof and camigrate's plan refuse it alike.
sign-after-init = []
# A module failure's CK_RV value and CKR_* name from cryptoki itself (CK_RV::from(RvError),
# RvError::name: upstream/rust-cryptoki/0003, which the Nix build applies). Without it a named
# failure carries no value, only its name.
rv-value = []
