[package]
name = "cakeys-core"
description = "cakeys: config, lock and content-addressed identity (no token access)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The entry points the fuzz targets (fuzz/) call: built only for them, the tests and Kani, never
# into a product (review D8).
fuzzing = []

[dependencies]
base16ct.workspace = true
# The tables core shares with the profiles and the token layer: curves, ECDSA hashes, proofs,
# commitments, modulus sizes (crates/names).
cakeys-names.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
ed448.workspace = true
elliptic-curve.workspace = true
hmac.workspace = true
sha1.workspace = true
p256.workspace = true
p384.workspace = true
p521.workspace = true
k256.workspace = true
bp256.workspace = true
bp384.workspace = true
rsa.workspace = true
serde.workspace = true
serde_jcs.workspace = true
serde_json.workspace = true
# `zeroize`: an HMAC keyed with a proof secret wipes its hash state on drop (pop.rs).
sha2 = { workspace = true, features = ["zeroize"] }
subtle.workspace = true
thiserror.workspace = true
toml.workspace = true
getrandom.workspace = true
zeroize.workspace = true
ecdsa.workspace = true
x509-cert.workspace = true
# SPKI and PKCS#8 for every key type, by name rather than through one curve crate's re-export.
pkcs8.workspace = true
der.workspace = true
rustix.workspace = true
tempfile.workspace = true

[dev-dependencies]
proptest.workspace = true
# tests/lock_mbt.rs: the lock rules replayed against their Quint model (spec/lock.qnt).
quint-connect.workspace = true
anyhow.workspace = true
