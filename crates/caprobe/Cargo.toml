[package]
name = "caprobe"
description = "Measure PKCS#11 modules: capability profiles by probing a token, and queries over them (cakeys)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "caprobe"

[[bin]]
name = "caprobe"
path = "src/main.rs"

[features]
default = ["tpm2", "ykcs11"]
# The fuzz targets' entry points (fuzz/): never in the product (review D8).
fuzzing = []
tpm2 = ["cakeys-cli-common/tpm2"]
ykcs11 = ["cakeys-cli-common/ykcs11"]
# Probe the key wraps only the patched cryptoki of the Nix build names (nix/patches):
# CKM_AES_KEY_WRAP_KWP and CKM_RSA_AES_KEY_WRAP. Without it they go unprobed (camigrate's `kwp`).
kwp = []
# Everything the patched cryptoki of the Nix build (nix/patches) makes possible, together: the
# build that links it names this one feature, never the parts by hand (review D3).
patched-cryptoki = ["kwp"]

[dependencies]
cakeys-cli-common.workspace = true
cakeys-core.workspace = true
cakeys-pkcs11.workspace = true
cakeys-profile.workspace = true
# The Montgomery curves the probe generates on (crates/names): no keys.toml object, so not core's.
cakeys-names.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
cryptoki.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom.workspace = true
# The import probes' AES check value, computed on the host.
aes.workspace = true
# The sealed exports, decoded on the host: RSA-OAEP to the imported test key, then RFC 5649.
aes-kw.workspace = true
rsa.workspace = true
sha1.workspace = true
# The scratch slot's mark, signed on the host by the P-256 test key.
p256.workspace = true

# The integration tests include crates/cli/tests/common (one harness for both tools), and with
# it its dependencies.
[dev-dependencies]
# The coverage test (src/coverage.rs) reads manual.toml.
serde.workspace = true
# tests/fault.rs loads its cdylib: as a dependency, every build of the tests makes it.
p11-fault = { path = "../p11-fault" }
base64.workspace = true
cmac.workspace = true
des.workspace = true
toml.workspace = true
x509-cert.workspace = true

[[test]]
name = "tpm2"
required-features = ["tpm2"]

[[test]]
name = "ftpm"
required-features = ["tpm2"]

[[test]]
name = "yubikey"
required-features = ["ykcs11"]
