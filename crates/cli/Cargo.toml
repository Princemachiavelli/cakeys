[package]
name = "cakeys"
description = "Content-addressed identity for PKCS#11 objects, TPM keys (tpm2-pkcs11) and YubiKey PIV slots (ykcs11) among them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "cakeys"

[[bin]]
name = "cakeys"
path = "src/main.rs"

[features]
default = ["tpm2", "ykcs11"]
# tpm2-pkcs11 provider with the native TPM2_Certify attestation (links tpm2-tss and sqlite).
tpm2 = ["cakeys-cli-common/tpm2"]
# ykcs11 provider (YubiKey PIV) with the piv-attestation commitment.
ykcs11 = ["cakeys-cli-common/ykcs11"]
# Everything the patched cryptoki of the Nix build (nix/patches) makes possible, together: the
# build that links it names this one feature, never the parts by hand (review D3).
patched-cryptoki = ["cakeys-pkcs11/rv-value"]

[dependencies]
cakeys-cli-common.workspace = true
cakeys-core.workspace = true
cakeys-pkcs11.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true

[dev-dependencies]
aes.workspace = true
aes-kw.workspace = true
base64.workspace = true
cmac.workspace = true
cryptoki.workspace = true
des.workspace = true
hmac.workspace = true
sha1.workspace = true
rsa.workspace = true
sha2.workspace = true
toml.workspace = true
x509-cert.workspace = true
rusqlite.workspace = true
# tests/fault.rs loads its cdylib: as a dependency, every build of the tests makes it.
p11-fault = { path = "../p11-fault" }

[[test]]
name = "tpm2"
required-features = ["tpm2"]

[[test]]
name = "yubikey"
required-features = ["ykcs11"]

[[test]]
name = "ftpm"
required-features = ["tpm2"]
