[package]
name = "cakeys"
description = "Content-addressed identity for PKCS#11 (and later TPM) objects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "cakeys"

[[bin]]
name = "cakeys"
path = "src/main.rs"

[features]
default = ["tpm2", "ykcs11"]
# tpm2-pkcs11 provider with the native TPM2_Certify attestation (links tpm2-tss and sqlite).
tpm2 = ["cakeys-cli-common/tpm2"]
# ykcs11 provider (YubiKey PIV) with the piv-attestation commitment.
ykcs11 = ["cakeys-cli-common/ykcs11"]

[dependencies]
cakeys-cli-common = { workspace = true, default-features = false }
cakeys-core.workspace = true
cakeys-pkcs11.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
aes.workspace = true
aes-kw.workspace = true
base64.workspace = true
cmac.workspace = true
cryptoki.workspace = true
hmac.workspace = true
sha1.workspace = true
rsa.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
x509-cert.workspace = true

[[test]]
name = "tpm2"
required-features = ["tpm2"]

[[test]]
name = "yubikey"
required-features = ["ykcs11"]

[[test]]
name = "ftpm"
required-features = ["tpm2"]
