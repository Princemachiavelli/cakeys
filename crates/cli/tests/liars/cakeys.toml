rv = "CKR_KEY_FUNCTION_NOT_PERMITTED"
'''

[lies."dev.read"]
class = "DEV"
plan = '''
[[rule]]
fn = "C_GetAttributeValue"
of_label = "{label}"
rv = "CKR_DEVICE_ERROR"
'''

[lies."dev.find"]
class = "DEV"
plan = '''
[[rule]]
fn = "C_FindObjectsInit"
rv = "CKR_DEVICE_ERROR"
'''

[lies."dev.destroy"]
class = "DEV"
plan = '''
[[rule]]
