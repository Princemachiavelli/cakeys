# The MAC with the derived or unwrapped secret, or the signature, fails.
[lies."dev.mac"]
class = "DEV"
plan = '''
[[rule]]
fn = "C_Sign"
rv = "CKR_DEVICE_ERROR"
'''

# The PIN refused once the module took it, and the per-use login of an always-authenticate key.
[lies."refused.login"]
class = "DEV"
plan = '''
[[rule]]
fn = "C_Login"
when = "after"
rv = "CKR_PIN_INCORRECT"
'''

[lies."refused.login.per-use"]
class = "DEV"
plan = '''
[[rule]]
fn = "C_Login"
nth = 2
rv = "CKR_PIN_INCORRECT"
'''

# A device failure is never a verdict: the row says device, and names no rule.
[[block]]
lies = ["dev.sign"]
verbs = ["lock", "lock --dry-run", "create"]
objects = ["ec-sign"]
expect = { exit = 16, device = true }

[[block]]
lies = ["dev.sign"]
verbs = ["check"]
objects = ["ec-sign", "aes"]
expect = { exit = 16 }

[[block]]
lies = ["refused.sign"]
verbs = ["check"]
objects = ["ec-sign", "aes"]
expect = { exit = 15 }

[[block]]
lies = ["refused.sign"]
verbs = ["lock --dry-run"]
objects = ["ec-sign"]
expect = { exit = 15 }

[[block]]
lies = ["dev.read"]
verbs = ["lock", "lock --dry-run", "delete", "delete --dry-run"]
objects = ["ec-sign"]
expect = { exit = 16, device = true }

[[block]]
lies = ["dev.read"]
verbs = ["check"]
objects = ["ec-sign", "cert", "data", "pub"]
expect = { exit = 16 }

[[block]]
lies = ["dev.find"]
verbs = ["lock --dry-run", "create", "create --dry-run"]
objects = ["ec-sign"]
expect = { exit = 16, device = true }

[[block]]
lies = ["dev.find"]
verbs = ["create --dry-run"]
objects = ["new-aes"]
expect = { exit = 16, device = true }

[[block]]
lies = ["dev.find"]
verbs = ["check"]
objects = ["ec-sign"]
expect = { exit = 16 }

# Every object of the token fails its find (16): several failures, 20.
[[block]]
lies = ["dev.find"]
verbs = ["check --token"]
objects = ["ec-sign"]
expect = { exit = 20 }

[[block]]
lies = ["dev.destroy"]
verbs = ["delete"]
objects = ["ec-sign", "aes", "cert", "data", "pub"]
expect = { exit = 16, device = true }

# A destroy the module refuses is unavailable (token/generate.rs destroy_plain), never a device failure.
[[block]]
lies = ["refused.destroy"]
verbs = ["delete"]
objects = ["ec-sign", "cert"]
expect = { exit = 16 }

[[block]]
lies = ["dev.generate"]
verbs = ["create"]
