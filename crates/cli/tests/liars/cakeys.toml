# ── LOSS: the device or the session gone from one call of a run on.

[lies."loss.removed"]
class = "LOSS"
plan = '''
[[rule]]
fn = "*"
from_seq = {seq:C_SignInit}
rv = "CKR_DEVICE_REMOVED"
'''

[lies."loss.session"]
class = "LOSS"
plan = '''
[[rule]]
fn = "*"
from_seq = {seq:C_SignInit}
rv = "CKR_SESSION_HANDLE_INVALID"
'''

[lies."loss.destroy"]
class = "LOSS"
plan = '''
[[rule]]
fn = "*"
from_seq = {seq:C_DestroyObject}
rv = "CKR_DEVICE_REMOVED"
'''

[lies."loss.generate"]
class = "LOSS"
plan = '''
[[rule]]
fn = "*"
from_seq = {seq:C_GenerateKeyPair}
rv = "CKR_TOKEN_NOT_PRESENT"
'''

[lies."loss.find"]
class = "LOSS"
plan = '''
[[rule]]
fn = "*"
from_seq = {seq:C_FindObjectsInit}
rv = "CKR_DEVICE_REMOVED"
'''

# A device gone mid-run is unavailable, and the lock keeps what it held.
[[block]]
lies = ["loss.removed", "loss.session"]
verbs = ["lock", "create"]
objects = ["ec-sign"]
expect = { exit = 16, device = true }

[[block]]
lies = ["loss.removed"]
verbs = ["lock --dry-run"]
objects = ["ec-sign"]
expect = { exit = 16, device = true }

[[block]]
lies = ["loss.removed", "loss.session"]
verbs = ["check"]
objects = ["ec-sign"]
expect = { exit = 16 }

[[block]]
lies = ["loss.removed"]
verbs = ["check"]
objects = ["aes"]
expect = { exit = 16 }

[[block]]
lies = ["loss.removed"]
verbs = ["create"]
objects = ["new", "new-aes"]
expect = { exit = 16, device = true, changed = [
  "token",
], why = "the module is gone before the undo: what it made stays on the token, and the run says so" }

[[block]]
lies = ["loss.destroy"]
verbs = ["delete"]
objects = ["ec-sign", "aes", "cert", "data", "pub"]
expect = { exit = 16, device = true }

[[block]]
lies = ["loss.generate"]
verbs = ["create"]
objects = ["new"]
expect = { exit = 16, device = true }

[[block]]
lies = ["loss.find"]
verbs = ["delete --dry-run", "create --dry-run"]
objects = ["ec-sign"]
expect = { exit = 16, device = true }

[[block]]
lies = ["loss.find"]
verbs = ["create --dry-run"]
objects = ["new"]
expect = { exit = 16, device = true }

# ── Grid points no cell covers, each decided.

[[na]]
classes = "*"
verbs = ["validate"]
objects = "*"
why = "validate opens no token: no lie reaches it"

# ── Rules of the plan no lie can fire here, each with the test of its own that does
# (liar_lint.rs: the test exists, and names the rule).

[[unit]]
rule = "placement"
test = "placement_holds_on_every_path"
why = "where a provider places a key is the provider's answer, asked before any module call"

[[unit]]
rule = "own-generation"
test = "a_provider_this_build_lacks_is_said"
why = "a provider that generates from its own template only; SoftHSM's generic provider has none"

[[unit]]
rule = "templates"
test = "the_gate_asks_the_provider_about_a_generation"
why = "the templates as the provider adjusts them; SoftHSM's generic provider adjusts none"

[[unit]]
rule = "locator-free"
test = "a_dry_run_refuses_what_the_run_refuses_on_the_token"
why = "p11-fault adds an object only to a search that found one: a free locator cannot be lied full"

[[unit]]
rule = "unpinned-exists"
test = "a_dry_run_refuses_what_the_run_refuses_on_the_token"
why = "as locator-free: an object under a free locator is the token's state, not a lie"

[[unit]]
rule = "needs-login"
test = "private_data_objects_are_identified_when_declared"
why = "a token configured without a PIN; a login the module only claims is ok.login's 16"

[[unit]]
rule = "delete-refused"
test = "a_profile_row_that_says_the_module_keeps_keys_refuses_the_delete"
why = "a module profile's row, read before any destroy; the module refusing is refused.destroy"

# Rules neither a lie nor a test of their own names: the tests rules.rs's `held` lists for them
# assert the exit code alone (validate.rs, camigrate's dry_run.rs, lockfile.rs), so each is
# exempt until one asserts its name. `max` only goes down.
[exempt]
max = 3

[exempt.rules]
attestation-cover = "the spec's attestation against its provider, decided before any token is opened"
imported-attestation = "an import's, which camigrate makes: its liars are camigrate's table's"
lock-writable = "the lock file's, not the module's"

[[na]]
classes = "*"
verbs = ["create", "create --dry-run"]
objects = ["certificate", "data", "public"]
why = "adopted, never created: create refuses them (17) before any token is opened"

[[na]]
classes = "*"
verbs = ["check --token"]
objects = ["secret", "certificate", "data", "public"]
why = "check --token is check of each object in one session: each object's verdict is its check cells'; its own cells, on ec-sign, show one refusal ends the run (20), or its token's failure (16)"

[[na]]
classes = ["CHANGE", "FORGE", "BLOB", "LOSS"]
verbs = ["check --token"]
objects = ["private"]
why = "as for the other classes: check of each object, whose cells these are"

[[na]]
classes = ["CHANGE"]
verbs = "*"
objects = ["secret", "certificate", "data", "public"]
why = "a run reads each value it decides by once (a_resolve_reads_the_public_key_once): within a run only a key pair's two objects are read twice, change.point's; between runs a change is an OTHER lie told to check after lock"

[[na]]
classes = ["CHANGE"]
verbs = ["delete", "delete --dry-run", "create --dry-run"]
objects = ["private"]
why = "a delete identifies as check does, whose change.point cells these are, then destroys, after which only the re-find reads (ok.destroy's); a dry run's create proves nothing (forge.sign's create --dry-run cells)"

[[na]]
classes = ["FORGE"]
verbs = ["create --dry-run"]
objects = ["private", "secret"]
why = "a dry run's create asks the rules on the token, and makes no proof or commitment: no output to forge"

[[na]]
classes = ["BLOB"]
verbs = "*"
objects = ["private", "certificate", "data", "public"]
why = "only a secret key's identity wraps (kw, wrap-rebind); camigrate's moves, which wrap the rest, are its table's"

[[na]]
classes = ["BLOB"]
verbs = ["create --dry-run"]
objects = ["secret"]
why = "a dry run commits nothing, so wraps nothing"

[[na]]
classes = ["LOSS"]
verbs = ["create --dry-run", "delete --dry-run"]
objects = ["certificate", "data", "public", "secret"]
why = "a dry run reads as check reads (loss.removed's cells), and writes nothing a loss could cut short; loss.find's cells take it at its first search"

[[na]]
classes = "*"
verbs = ["lock", "lock --dry-run", "delete --dry-run"]
objects = ["secret", "certificate", "data", "public"]
why = "lock and the dry runs identify each object as check does (one resolve, then the lock's or the plan's step): each lie's cells there take a key pair, and check's every class"

[[na]]
classes = ["OK"]
verbs = ["check"]
objects = ["secret", "certificate", "public"]
why = "nothing but a delete destroys, and a login is the token's, made before any object is read: ok.login's check cells on a key and a private data object"

[[na]]
classes = ["LOSS"]
verbs = ["check"]
objects = ["certificate", "data", "public"]
why = "loss.removed and loss.session start at a proof, which an adopted object's check never makes; a device gone at its reads is dev.read's cells on each"
