# The README's coverage and mutation badges: on each push to main, `nix build .#coverage` and
# `nix build .#mutants` (reports, never checks: docs/DEVELOPMENT.md, "Testing"), each reduced
# by scripts/badges.sh to a shields.io endpoint file and pushed to the `badges` branch, which
# holds nothing else. A job that fails leaves its badge as it was.
name: reports

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, the newest kept: two runs would race on the badges branch.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  report:
    strategy:
      fail-fast: false
      matrix:
        report: [coverage, mutants]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      # The runner image's toolchains the build never uses: room for the Nix store.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          diagnostic-endpoint: ""
      # What the run builds (not what cache.nixos.org serves), kept in the GitHub Actions cache.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""
      - run: nix build -L --out-link result .#${{ matrix.report }}
      - run: bash scripts/badges.sh ${{ matrix.report }} result > "$RUNNER_TEMP/badge.json"
      # The branch is created by the first run. The other job may push between the fetch and
      # the push: fetch again and retry.
      - name: Push the badge
        env:
          TOKEN: ${{ github.token }}
          REPORT: ${{ matrix.report }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git init -q "$RUNNER_TEMP/badges"
          cd "$RUNNER_TEMP/badges"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config http.https://github.com/.extraheader "$auth"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          for attempt in 1 2 3 4 5; do
            if git fetch -q --depth 1 origin badges; then
              git checkout -q --detach FETCH_HEAD
            else
              git checkout -q --orphan "first-$attempt"
            fi
            cp "$RUNNER_TEMP/badge.json" "$REPORT.json"
            git add "$REPORT.json"
            git diff --cached --quiet && exit 0
            git commit -q -m "$REPORT badge for $GITHUB_SHA"
            git push -q origin HEAD:refs/heads/badges && exit 0
            sleep $((attempt * 5))
          done
          exit 1
