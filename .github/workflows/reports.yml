# The README's coverage and mutation badges: `nix build .#coverage` on each push to main,
# `nix build .#mutants` (hours on a runner) weekly, both on a manual run. Each is a report,
# never a check (docs/DEVELOPMENT.md, "Testing"): scripts/badges.sh reduces it to a shields.io
# endpoint file, pushed to the `badges` branch, which holds nothing else. A report that fails
# leaves its badge as it was.
#
# Each report is two jobs, so the write token never sits beside repository code: the build
# runs Nix and badges.sh with the read-only token and hands the badge file on as an artifact;
# its publish job, the only one that may write, downloads that file and pushes it. The reports
# do not wait for each other: coverage publishes without waiting hours for mutants, so a later
# run's coverage is never overwritten by an older one published late.
name: reports

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    # One run of each report at a time, the newest kept.
    concurrency:
      group: ${{ github.workflow }}-coverage
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      REPORT: coverage
    steps: &build
      # The runner image's toolchains the build never uses: room for the Nix store.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          diagnostic-endpoint: ""
      # What the run builds (not what cache.nixos.org serves), kept in the GitHub Actions cache.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""
      - run: nix build -L --out-link result ".#$REPORT"
      - run: |
          mkdir -p "$RUNNER_TEMP/badge"
          bash scripts/badges.sh "$REPORT" result >"$RUNNER_TEMP/badge/$REPORT.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: badge-${{ env.REPORT }}
          path: ${{ runner.temp }}/badge/${{ env.REPORT }}.json
          if-no-files-found: error
          retention-days: 1

  mutants:
    if: github.event_name != 'push'
    concurrency:
      group: ${{ github.workflow }}-mutants
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      REPORT: mutants
    steps: *build

  # No checkout and no Nix: nothing of the repository runs next to the write token.
  publish-coverage:
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      REPORT: coverage
    steps: &publish
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: badge-${{ env.REPORT }}
          path: ${{ runner.temp }}/badge
      # The branch is created by the first run. The other report may push between the fetch and
      # the push: fetch again and retry.
      - name: Push the badge
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git init -q "$RUNNER_TEMP/badges"
          cd "$RUNNER_TEMP/badges"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config http.https://github.com/.extraheader "$auth"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          for attempt in 1 2 3 4 5; do
            if git fetch -q --depth 1 origin badges; then
              git checkout -q --detach FETCH_HEAD
            else
              git checkout -q --orphan "first-$attempt"
            fi
            cp "$RUNNER_TEMP/badge/$REPORT.json" "$REPORT.json"
            git add "$REPORT.json"
            git diff --cached --quiet && exit 0
            git commit -q -m "$REPORT badge for $GITHUB_SHA"
            git push -q origin HEAD:refs/heads/badges && exit 0
            sleep $((attempt * 5))
          done
          exit 1

  publish-mutants:
    needs: mutants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      REPORT: mutants
    steps: *publish
