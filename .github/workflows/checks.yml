# The light gate: every flake check that needs no VM and no fuzz run (packages.checks-no-vm in
# flake.nix): the crane build with its token suites, clippy, rustdoc, formatting, cargo-deny,
# MSRV, the demo and the SoftHSM repros. flake-check.yml runs everything.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The runner image's toolchains the build never uses: room for the Nix store.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          diagnostic-endpoint: ""
      # What the run builds (not what cache.nixos.org serves), kept in the GitHub Actions cache.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""
      - run: nix build -L .#checks-no-vm
