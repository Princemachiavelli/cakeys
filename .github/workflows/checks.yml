# CI: every flake check, split over three runners so none waits on or shares memory with
# another (flake.nix, `vmChecks`). `light` builds every check that needs no VM, no fuzz run and
# no Kani (the crane build with its token suites, clippy, rustdoc, formatting, cargo-deny, MSRV,
# the demo, the SoftHSM repros, ...) and evaluates every output; `vm` the NixOS VM tests and
# the fuzz smoke run; `kani` the Kani proofs, up to 5.7 GB each (nix/package-crane.nix); `darwin`
# every check that needs no VM, on an aarch64 macOS runner. The other three run on x86_64 Linux.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: light
            build: .#checks-no-vm
          - job: vm
            build: .#checks-vm
          - job: kani
            build: .#checks.x86_64-linux.kani
          # Without this job no check ran on darwin, and the darwin build stayed broken unseen.
          - job: darwin
            build: .#packages.aarch64-darwin.checks-no-vm
            os: macos-latest
    name: ${{ matrix.job }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 300
    steps:
      # The runner image's toolchains the build never uses: room for the Nix store.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The golden rows below compare with the pull request's base.
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          diagnostic-endpoint: ""
      # What the run builds (not what cache.nixos.org serves), kept in the GitHub Actions cache.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""
      # The VM tests need /dev/kvm, which GitHub's standard Linux runners give public
      # repositories (determinate-nix-action opens it to the build users). Without it they would
      # fall back to emulation and crawl into the timeout: fail here instead.
      - name: KVM is available
        if: matrix.job == 'vm'
        run: test -w /dev/kvm
      # What no check builds still evaluates: packages, apps, the module, the dev shell. Without
      # --all-systems, nix evaluates only the runner's own system and skips the darwin outputs.
      - name: Every output evaluates
        if: matrix.job == 'light'
        run: nix flake check --no-build --all-systems
      # Each change of a golden file in the pull request has a record in profiles/LEDGER.toml
      # that lists exactly the rows that the change moved, each with its old value.
      # nix/golden-rows.py reads every commit since the merge base, so the checkout step above
      # fetches the whole history. checks.ledger checks the rest without git. The listed rows go
      # to the job summary.
      - name: Golden rows
        if: matrix.job == 'light' && github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: nix develop -c python3 -I nix/golden-rows.py --base "$(git merge-base "origin/$BASE" HEAD)" .
      - run: nix build -L ${{ matrix.build }}
