# p11-kit's client module (p11-kit-client.so), forwarding any module served by `p11-kit
# server` over a socket. Observed with 0.26.5 [run]. C_GetInfo describes p11-kit, not the
# module behind it: name that module's profile too (its provider's provider = "...").
# Hand-maintained, never generated: tests/p11kit.rs probes SoftHSM through it and checks that
# exactly these mechanisms vanish from C_GetMechanismList (the client filters the list).
profile = "p11-kit/0.26"
mode = "delta"
requires-provider = true

[match]
manufacturer = "PKCS#11 Kit"
module-version = "0.26"

[subtract]
mechanisms = [
  "CKM_AES_KEY_WRAP",
  "CKM_AES_KEY_WRAP_PAD",
  "CKM_EC_EDWARDS_KEY_PAIR_GEN",
  "CKM_EDDSA",
  "CKM_AES_CBC_ENCRYPT_DATA",
  "CKM_CONCATENATE_BASE_AND_DATA",
  "CKM_CONCATENATE_BASE_AND_KEY",
  "CKM_CONCATENATE_DATA_AND_BASE",
  "CKM_RSA_AES_KEY_WRAP",
]
note = "the RPC does not marshal these mechanisms [run]"

[notes]
requires-provider = "p11-kit is a passthrough with limits of its own (the mechanisms its RPC drops); the module behind it is hidden, so none of that module's quirks apply until keys.toml names its `provider`"
