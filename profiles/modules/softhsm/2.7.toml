[match]
manufacturer = "SoftHSM"
module-version = "2.7"
model = "SoftHSM v2"
firmware = "2.7"

[wrap]
oaep = ["SHA-1"]

[unwrap]
refuse = ["CKA_VALUE_LEN"]

[decrypt]
oaep = ["SHA-1"]

[derive]
sealed = true
key-attribute = true
read-only = true

[generate."CKK_EC"]
can = ["secp256r1", "secp384r1", "secp521r1", "secp256k1", "brainpoolP256r1", "brainpoolP384r1"]

[generate."CKK_EC_EDWARDS"]
can = ["edwards25519", "edwards448"]

[generate."CKK_EC_MONTGOMERY"]
cannot = ["curve25519", "curve448"]

[generate."CKK_RSA"]
min-bits = 512
max-bits = 16384
can-bits = [1024, 2048, 3072, 4096]

[migration]
secret-unwraps = false

[notes]
"CKA_VALUE_LEN" = "CKR_ATTRIBUTE_READ_ONLY in an unwrap template"
"CKM_RSA_PKCS_OAEP" = "RSA-2048 decrypt SHA-256: CKR_ARGUMENTS_BAD"
"cryptoki" = "the module reports Cryptoki 3.2"
"curve25519" = "generation refused: CKR_MECHANISM_INVALID"
"curve448" = "generation refused: CKR_MECHANISM_INVALID"
"oaep" = "SHA-256: wrapping fails: CKR_ARGUMENTS_BAD"

[manual."secret-unwraps"]
finding = "C_UnwrapKey stores an unwrapped secret key's CKA_VALUE but never its CKA_VALUE_LEN, which then reads 0, and a template that sets it is refused (CKR_ATTRIBUTE_READ_ONLY, [unwrap] refuse). cakeys' type check reads the length, so a secret key imported sealed into SoftHSM cannot be verified there: the [migration] claim secret-unwraps = false makes the plan say so. Private keys unwrap whole."
evidence = "[src] SoftHSM 2.7.0 src/lib/SoftHSM.cpp C_UnwrapKey (sets CKA_VALUE only); [run] crates/camigrate/tests/dry_run.rs, an AES key unwrapped from kryoptic reporting CKA_VALUE_LEN 0, 2026-11-14"

[manual."trusted-wrap"]
finding = "A CKA_WRAP_WITH_TRUSTED key is refused under an untrusted wrapping key (CKR_KEY_NOT_WRAPPABLE), also by CKM_RSA_AES_KEY_WRAP and plain OAEP. CKA_TRUSTED is read-only once an object exists, the SO's too (CKR_ATTRIBUTE_READ_ONLY), but an RSA public key the SO creates with CKA_TRUSTED = true is trusted, and CKM_RSA_AES_KEY_WRAP under it wraps the key: the transport key is then the only trusted object an export needs. Its output is OAEP(fresh AES key) then RFC 5649 of the key, which kryoptic unwraps in two steps to the same key."
evidence = "[run] one-off test programs on scratch SoftHSM 2.7.0 and kryoptic 1.5.4 tokens, 2026-11-14 (docs/CAMIGRATE.md phase 3b; not kept in the repository): a PyKCS11 script that tried each step and recorded each return code, and a Rust program on the patched cryptoki (nix/patches/cryptoki-rsa-aes-key-wrap.patch) that wrapped a CKA_WRAP_WITH_TRUSTED key with CKM_RSA_AES_KEY_WRAP under a trusted and an untrusted copy of an RSA key, split the output at the modulus length, and unwrapped it on kryoptic in two steps to the same key value"

[manual."unwrap-value-len"]
finding = "C_UnwrapKey leaves CKA_VALUE_LEN of an unwrapped AES key at 0 (CKA_VALUE is right, 32 bytes for AES-256) with CKM_AES_KEY_WRAP, CKM_AES_KEY_WRAP_PAD and CKM_RSA_PKCS_OAEP, and a template cannot set it: that is the CKR_ATTRIBUTE_READ_ONLY refusal in unwrap.refuse, which is what PKCS#11 asks (v2.40 4.1.2, footnote 6: the mechanism supplies it). A spec with value-len therefore fails `check` on a SoftHSM-unwrapped key. Fixed by upstream/softhsm/ (SoftHSMv2 #628, not yet released); the probe cannot see it, because it never reads the unwrapped key's CKA_VALUE_LEN."
evidence = "[run] upstream/softhsm/repro.sh against nixpkgs' softhsm 2.7.0: CKA_VALUE_LEN=0 for all three mechanisms, 32 with the patch, 2026-11-13; [src] SoftHSM.cpp C_UnwrapKey stores CKA_VALUE only (2.7.0 and main 7380895); [src] crates/pkcs11/src/token/policy.rs, the `CKA_VALUE_LEN mismatch` branch of a spec's value-len"
