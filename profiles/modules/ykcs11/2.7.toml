# Generated by `caprobe probe` (docs/PROVIDERS.md phase 3). Never edit: regenerate
# with `caprobe probe --token <t> --write --diff <profile> --out <this file>`; the
# conformance test re-probes and compares on every build. A profile is what the
# probe measured: this module on this token's hardware, together. Only [migration]
# and [manual] are not probe output: this repo's claims and hand findings,
# preserved across regenerations.
profile = "ykcs11/2.7"
mode = "observed"
advertise = [
  "CKM_ECDH1_DERIVE",
  "CKM_ECDSA",
  "CKM_ECDSA_SHA1",
  "CKM_ECDSA_SHA256",
  "CKM_ECDSA_SHA384",
  "CKM_ECDSA_SHA512",
  "CKM_EC_EDWARDS_KEY_PAIR_GEN",
  "CKM_EC_KEY_PAIR_GEN",
  "CKM_EC_MONTGOMERY_KEY_PAIR_GEN",
  "CKM_EDDSA",
  "CKM_RSA_PKCS",
  "CKM_RSA_PKCS_KEY_PAIR_GEN",
  "CKM_RSA_PKCS_OAEP",
  "CKM_RSA_PKCS_PSS",
  "CKM_RSA_X_509",
  "CKM_SHA1_RSA_PKCS",
  "CKM_SHA1_RSA_PKCS_PSS",
  "CKM_SHA256",
  "CKM_SHA256_RSA_PKCS",
  "CKM_SHA256_RSA_PKCS_PSS",
  "CKM_SHA384",
  "CKM_SHA384_RSA_PKCS",
  "CKM_SHA384_RSA_PKCS_PSS",
  "CKM_SHA512",
  "CKM_SHA512_RSA_PKCS",
  "CKM_SHA512_RSA_PKCS_PSS",
  "CKM_SHA_1",
]

[match]
manufacturer = "Yubico (www.yubico.com)"
module-version = "2.73"
model = "YubiKey YK5"
firmware = "5.74"

[decrypt]
oaep = ["SHA-1", "SHA-256"]

[derive]
sealed = false
key-attribute = false
read-only = true

[generate."CKK_EC"]
can = ["secp256r1", "secp384r1"]
cannot = ["secp521r1", "secp256k1", "brainpoolP256r1", "brainpoolP384r1"]

[generate."CKK_EC_EDWARDS"]
can = ["edwards25519"]
cannot = ["edwards448"]
by-name = ["edwards25519"]

[generate."CKK_EC_MONTGOMERY"]
cannot = ["curve25519", "curve448"]

[generate."CKK_RSA"]
min-bits = 1024
max-bits = 4096
can-bits = [2048, 3072, 4096]
cannot-bits = [1024]

[migration]
exports = false
unwraps = false
plaintext-import = "piv-import"

[[migration.public-accepts]]
class = "CKO_CERTIFICATE"

[[migration.plaintext-accepts]]
class = "CKO_PRIVATE_KEY"
key-types = ["CKK_RSA"]
min-bits = 1024
max-bits = 4096

[[migration.plaintext-accepts]]
class = "CKO_PRIVATE_KEY"
key-types = ["CKK_EC"]
curves = ["secp256r1", "secp384r1"]

[[migration.plaintext-accepts]]
class = "CKO_PRIVATE_KEY"
key-types = ["CKK_EC_EDWARDS"]
curves = ["edwards25519"]

[notes]
"CKK_RSA at 1024" = "modulusBits = 1024: CKR_ARGUMENTS_BAD"
"brainpoolP256r1" = "generation refused: CKR_ATTRIBUTE_VALUE_INVALID"
"brainpoolP384r1" = "generation refused: CKR_ATTRIBUTE_VALUE_INVALID"
"cryptoki" = "the module reports Cryptoki 3.0"
"curve25519" = "generation refused: CKR_ATTRIBUTE_VALUE_INVALID"
"curve448" = "generation refused: CKR_ATTRIBUTE_VALUE_INVALID"
"derive.key-attribute" = "secp256r1: derives although the key reports CKA_DERIVE = false"
"derive.sealed" = "a sealed (non-extractable) derived secret is refused: CKR_ATTRIBUTE_VALUE_INVALID"
"edwards448" = "generation refused: CKR_ATTRIBUTE_VALUE_INVALID"
"secp256k1" = "generation refused: CKR_ATTRIBUTE_VALUE_INVALID"
"secp521r1" = "generation refused: CKR_ATTRIBUTE_VALUE_INVALID"

[manual."destroy"]
finding = "C_DestroyObject writes an empty certificate to the slot and hides its objects for the rest of the session; the key stays and is listed again by the next session. cakeys refuses delete (15) and names `ykman piv keys delete <slot>`."
evidence = "[run] YubiKey 5C NFC FIPS 5.7.4, ykcs11 2.7.3, 2026-11-13 (tests/yubikey.rs's rw test); the probe cannot observe it in a scratch slot without erasing the slot's key"

[manual."fips-mode"]
finding = "Probed with the PIV application in FIPS-approved mode. The refusals of RSA-1024 generation and of every curve but P-256, P-384 and Ed25519 may be the approved mode's, not the module's: a non-FIPS YubiKey at the same firmware has the same match keys (model YubiKey YK5, firmware 5.74) and would resolve this profile, so `validate` may refuse there what that device can do. D12's [match.fields] (the mode as a match key) separate the two once a non-FIPS key is probed. The [migration] plaintext-accepts rows (RSA from 1024 bits) are older claims, untested in approved mode."
evidence = "[run] `ykman info` and `ykman piv info` on the probed device: PIV 'FIPS approved: True', management key AES256 PIN-protected, 2026-11-13"

[manual."so"]
finding = "Creates and destroys only after C_Login(CKU_SO) with the PIV management key, into the slot the template's CKA_ID names (01-04: 9a/9c/9d/9e, 05-18: retired 82-95); CKA_LABEL is ignored. A 48- or 64-hex-digit management key logs in without a PIN verification, so no PIN retry is spent; on a PIN-protected management key the PIN works too, and is verified."
evidence = "[src] ykcs11/ykcs11.c C_Login, ykcs11/token.c token_login, ykcs11/objects.c check_*_pubkey_template"

[manual."x25519"]
finding = "X25519 cannot be generated through ykcs11 2.7.3 by a spec-conformant caller: its key-pair template accepts CKA_EC_PARAMS only as the bytes `13 0b 'curve25519'`, a PrintableString whose length byte (11) disagrees with its 10 characters. The OID (1.3.101.110) and the well-formed name `13 0a 'curve25519'` are both refused (CKR_ATTRIBUTE_VALUE_INVALID). Its X25519 objects report the same malformed CKA_EC_PARAMS. Whether this device generates X25519 at all, approved mode or not, is not observable through ykcs11; cakeys has no Montgomery key type yet either."
evidence = "[src] yubico-piv-tool 2.7.3 ykcs11/objects.c: the X25519 define (line 43) and check_x_pubkey_template; [run] the probe's curve25519 refusals, 2026-11-13"
