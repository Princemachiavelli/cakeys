# Generated by `caprobe probe` (docs/CAPROBE.md): what the probe measured, this module
# on this token's hardware together. Regenerate it with `caprobe regenerate`, not by hand.
# profiles/LEDGER.toml names the command and whether a build re-probes this file; if
# none does, the run it was last probed in and every hand edit since, which
# nix/ledger.py holds to the file and to the code on its path. Only [migration], the
# move.* capabilities and [manual] are not probe output: this repo's claims and hand
# findings, preserved across regenerations.
profile = "ykcs11/2.7"
mode = "observed"
advertise = [
  "CKM_ECDH1_DERIVE",
  "CKM_ECDSA",
  "CKM_ECDSA_SHA1",
  "CKM_ECDSA_SHA256",
  "CKM_ECDSA_SHA384",
  "CKM_ECDSA_SHA512",
  "CKM_EC_EDWARDS_KEY_PAIR_GEN",
  "CKM_EC_KEY_PAIR_GEN",
  "CKM_EC_MONTGOMERY_KEY_PAIR_GEN",
  "CKM_EDDSA",
  "CKM_RSA_PKCS",
  "CKM_RSA_PKCS_KEY_PAIR_GEN",
  "CKM_RSA_PKCS_OAEP",
  "CKM_RSA_PKCS_PSS",
  "CKM_RSA_X_509",
  "CKM_SHA1_RSA_PKCS",
  "CKM_SHA1_RSA_PKCS_PSS",
  "CKM_SHA256",
  "CKM_SHA256_RSA_PKCS",
  "CKM_SHA256_RSA_PKCS_PSS",
  "CKM_SHA384",
  "CKM_SHA384_RSA_PKCS",
  "CKM_SHA384_RSA_PKCS_PSS",
  "CKM_SHA512",
  "CKM_SHA512_RSA_PKCS",
  "CKM_SHA512_RSA_PKCS_PSS",
  "CKM_SHA_1",
]
add = ["CKM_ECDSA_SHA224"]

[untested]
"CKM_SHA256" = { why = "scope", note = "the tools hash on the host, so a module's digest is never asked of it" }
"CKM_SHA384" = { why = "scope", note = "the tools hash on the host, so a module's digest is never asked of it" }
"CKM_SHA512" = { why = "scope", note = "the tools hash on the host, so a module's digest is never asked of it" }
"CKM_SHA_1" = { why = "scope", note = "the tools hash on the host, so a module's digest is never asked of it" }

