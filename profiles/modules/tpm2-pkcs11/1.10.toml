# tpm2-pkcs11 1.10 (tpm2-software), observed on swtpm. The P-521 point repair and the
# native TPM2_Certify attestation stay in the provider crate (PROVIDERS.md D6).
profile = "tpm2-pkcs11/1.10"
mode = "observed"
partial = true

[match]
manufacturer = "tpm2-software.github.io"
module-version = "1.10"

[subtract]
mechanisms = ["CKM_AES_KEY_GEN", "CKM_GENERIC_SECRET_KEY_GEN"]

# TPM-bound keys never leave: they come in through `tpm2_ptool import` of EC P-256/384 (not
# P-521), RSA and the HMAC key types; `C_CreateObject` makes certificates, data objects and
# RSA public keys [src]. The native TPM2_Import of a duplication blob is MIGRATE.md phase 6.
[migration]
exports = false
unwraps = false
plaintext-import = "tpm2-ptool"

[[migration.public-accepts]]
class = "CKO_CERTIFICATE"

[[migration.public-accepts]]
class = "CKO_DATA"

[[migration.public-accepts]]
class = "CKO_PUBLIC_KEY"
key-types = ["CKK_RSA"]

[[migration.plaintext-accepts]]
class = "CKO_PRIVATE_KEY"
key-types = ["CKK_EC"]
curves = ["secp256r1", "secp384r1"]

[[migration.plaintext-accepts]]
class = "CKO_PRIVATE_KEY"
key-types = ["CKK_RSA"]
min-bits = 1024
max-bits = 3072

[[migration.plaintext-accepts]]
class = "CKO_SECRET_KEY"
key-types = ["CKK_SHA_1_HMAC", "CKK_SHA224_HMAC", "CKK_SHA256_HMAC", "CKK_SHA384_HMAC", "CKK_SHA512_HMAC"]

[notes]
CKM_AES_KEY_GEN = "advertised but C_GenerateKey returns CKR_FUNCTION_NOT_SUPPORTED [run]"
CKM_GENERIC_SECRET_KEY_GEN = "advertised but C_GenerateKey returns CKR_FUNCTION_NOT_SUPPORTED [run]"
secret-keys = "create them with tpm2_ptool addkey or tpm2_ptool import and adopt them (no autoCreate)"
