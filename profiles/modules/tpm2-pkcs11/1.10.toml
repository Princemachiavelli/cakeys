# tpm2-pkcs11 1.10 (tpm2-software), observed on swtpm. The P-521 point repair and the
# native TPM2_Certify attestation stay in the provider crate (PROVIDERS.md D6).
profile = "tpm2-pkcs11/1.10"
mode = "observed"
partial = true

[match]
manufacturer = "tpm2-software.github.io"
module-version = "1.10"

[subtract]
mechanisms = ["CKM_AES_KEY_GEN", "CKM_GENERIC_SECRET_KEY_GEN"]

[notes]
CKM_AES_KEY_GEN = "advertised but C_GenerateKey returns CKR_FUNCTION_NOT_SUPPORTED [run]"
CKM_GENERIC_SECRET_KEY_GEN = "advertised but C_GenerateKey returns CKR_FUNCTION_NOT_SUPPORTED [run]"
secret-keys = "create them with tpm2_ptool addkey or tpm2_ptool import and adopt them (no autoCreate)"
