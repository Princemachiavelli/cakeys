# Generated by `cakeys probe` (docs/PROVIDERS.md phase 3). Never edit: regenerate
# with `cakeys probe --token <t> --write --diff <profile> --out <this file>`; the
# conformance test re-probes and compares on every build. A profile is what the
# probe measured: this module on this token's hardware, together. Only [migration]
# and [manual] are not probe output: this repo's claims and hand findings,
# preserved across regenerations.
profile = "tpm2-pkcs11/1.10+swtpm"
mode = "observed"
advertise = [
  "CKM_AES_CBC",
  "CKM_AES_CBC_PAD",
  "CKM_AES_CFB128",
  "CKM_AES_CTR",
  "CKM_AES_ECB",
  "CKM_AES_KEY_GEN",
  "CKM_ECDH1_DERIVE",
  "CKM_ECDSA",
  "CKM_ECDSA_SHA1",
  "CKM_ECDSA_SHA256",
  "CKM_ECDSA_SHA384",
  "CKM_ECDSA_SHA512",
  "CKM_EC_KEY_PAIR_GEN",
  "CKM_RSA_PKCS",
  "CKM_RSA_PKCS_KEY_PAIR_GEN",
  "CKM_RSA_PKCS_OAEP",
  "CKM_RSA_PKCS_PSS",
  "CKM_RSA_X_509",
  "CKM_SHA1_RSA_PKCS",
  "CKM_SHA1_RSA_PKCS_PSS",
  "CKM_SHA256",
  "CKM_SHA256_HMAC",
  "CKM_SHA256_RSA_PKCS",
  "CKM_SHA256_RSA_PKCS_PSS",
  "CKM_SHA384",
  "CKM_SHA384_HMAC",
  "CKM_SHA384_RSA_PKCS",
  "CKM_SHA384_RSA_PKCS_PSS",
  "CKM_SHA512",
  "CKM_SHA512_HMAC",
  "CKM_SHA512_RSA_PKCS",
  "CKM_SHA512_RSA_PKCS_PSS",
  "CKM_SHA_1",
  "CKM_SHA_1_HMAC",
]

[match]
manufacturer = "tpm2-software.github.io"
module-version = "1.10"
model = "SW   TPM"
firmware = "36.37"

[decrypt]
oaep = ["SHA-1", "SHA-256"]

[derive]
sealed = false
key-attribute = true
read-only = false

[subtract]
mechanisms = ["CKM_AES_KEY_GEN"]

[generate."CKK_EC"]
can = ["secp256r1", "secp384r1", "secp521r1"]
cannot = ["secp256k1", "brainpoolP256r1", "brainpoolP384r1"]

[generate."CKK_EC_EDWARDS"]
cannot = ["edwards25519", "edwards448"]

[generate."CKK_EC_MONTGOMERY"]
cannot = ["curve25519", "curve448"]

[generate."CKK_RSA"]
min-bits = 1024
max-bits = 3072
can-bits = [1024, 2048, 3072]
cannot-bits = [4096]

[migration]
exports = false
unwraps = false
plaintext-import = "tpm2-ptool"

[[migration.public-accepts]]
class = "CKO_CERTIFICATE"

[[migration.public-accepts]]
class = "CKO_DATA"

[[migration.public-accepts]]
class = "CKO_PUBLIC_KEY"
key-types = ["CKK_RSA"]

[[migration.plaintext-accepts]]
class = "CKO_PRIVATE_KEY"
key-types = ["CKK_EC"]
curves = ["secp256r1", "secp384r1"]

[[migration.plaintext-accepts]]
class = "CKO_PRIVATE_KEY"
key-types = ["CKK_RSA"]
min-bits = 1024
max-bits = 3072

[[migration.plaintext-accepts]]
class = "CKO_SECRET_KEY"
key-types = ["CKK_SHA_1_HMAC", "CKK_SHA224_HMAC", "CKK_SHA256_HMAC", "CKK_SHA384_HMAC", "CKK_SHA512_HMAC"]

[notes]
"CKK_RSA at 4096" = "modulusBits = 4096: CKR_ATTRIBUTE_VALUE_INVALID"
"CKM_AES_KEY_GEN" = "advertised but generation fails: CKR_FUNCTION_NOT_SUPPORTED"
"brainpoolP256r1" = "generation refused: CKR_CURVE_NOT_SUPPORTED"
"brainpoolP384r1" = "generation refused: CKR_CURVE_NOT_SUPPORTED"
"cryptoki" = "the module reports Cryptoki 2.40"
"curve25519" = "generation refused: CKR_MECHANISM_INVALID"
"curve448" = "generation refused: CKR_MECHANISM_INVALID"
"derive.destroy" = "secp256r1: the sealed derived secret cannot be destroyed: CKR_FUNCTION_FAILED"
"derive.read-only" = "secp256r1: in a read-only session: CKR_SESSION_READ_ONLY"
"derive.sealed" = "derives into a sealed secret, but HMAC with it fails: CKR_GENERAL_ERROR"
"destroy" = "C_DestroyObject leaves objects behind: cakeys-probe-01"
"edwards25519" = "generation refused: CKR_MECHANISM_INVALID"
"edwards448" = "generation refused: CKR_MECHANISM_INVALID"
"secp256k1" = "generation refused: CKR_CURVE_NOT_SUPPORTED"
