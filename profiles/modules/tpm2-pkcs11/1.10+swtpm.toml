[manual."data-objects"]
finding = "tpm2-pkcs11 creates a data object only with CKA_PRIVATE = true (it seals CKA_VALUE), and camigrate moves no private data object (cakeys identifies one only when its spec declares CKA_PRIVATE = true: a value hash in the lock would let anyone guess a guessable value offline). So no public-accepts row for CKO_DATA: a data object cannot move to this module."
evidence = "[src] tpm2-pkcs11 1.10.1 src/lib/object.c handle_data_object: 'CKA_PRIVATE cannot be CK_FALSE' (CKR_ATTRIBUTE_VALUE_INVALID); [run] crates/camigrate/tests/dry_run.rs planting a public data object on swtpm, 2026-11-14"
