profile = "tpm2-pkcs11/1.10+swtpm"
mode = "observed"
advertise = [
  "CKM_AES_CBC",
  "CKM_AES_CBC_PAD",
  "CKM_AES_CFB128",
  "CKM_AES_CTR",
  "CKM_AES_ECB",
  "CKM_AES_KEY_GEN",
  "CKM_ECDH1_DERIVE",
  "CKM_ECDSA",
  "CKM_ECDSA_SHA1",
  "CKM_ECDSA_SHA256",
  "CKM_ECDSA_SHA384",
  "CKM_ECDSA_SHA512",
  "CKM_EC_KEY_PAIR_GEN",
  "CKM_RSA_PKCS",
  "CKM_RSA_PKCS_KEY_PAIR_GEN",
  "CKM_RSA_PKCS_OAEP",
  "CKM_RSA_PKCS_PSS",
  "CKM_RSA_X_509",
  "CKM_SHA1_RSA_PKCS",
  "CKM_SHA1_RSA_PKCS_PSS",
  "CKM_SHA256",
  "CKM_SHA256_HMAC",
  "CKM_SHA256_RSA_PKCS",
  "CKM_SHA256_RSA_PKCS_PSS",
  "CKM_SHA384",
  "CKM_SHA384_HMAC",
  "CKM_SHA384_RSA_PKCS",
  "CKM_SHA384_RSA_PKCS_PSS",
  "CKM_SHA512",
  "CKM_SHA512_HMAC",
  "CKM_SHA512_RSA_PKCS",
  "CKM_SHA512_RSA_PKCS_PSS",
  "CKM_SHA_1",
  "CKM_SHA_1_HMAC",
]

[match]
manufacturer = "tpm2-software.github.io"
module-version = "1.10"
model = "SW   TPM"
firmware = "36.37"

[subtract]
mechanisms = ["CKM_AES_KEY_GEN"]

[capabilities]
"generate.CKK_EC.brainpoolP256r1" = { answer = "no" }
"generate.CKK_EC.brainpoolP384r1" = { answer = "no" }
"generate.CKK_EC.secp256k1" = { answer = "no" }
"generate.CKK_EC.secp256r1" = { answer = "yes" }
"generate.CKK_EC.secp384r1" = { answer = "yes" }
"generate.CKK_EC.secp521r1" = { answer = "yes" }
"generate.CKK_EC_EDWARDS.edwards25519" = { answer = "no" }
"generate.CKK_EC_EDWARDS.edwards448" = { answer = "no" }
"generate.CKK_EC_MONTGOMERY.curve25519" = { answer = "no" }
"generate.CKK_EC_MONTGOMERY.curve448" = { answer = "no" }
"generate.CKK_RSA.1024" = { answer = "yes" }
"generate.CKK_RSA.2048" = { answer = "yes" }
"generate.CKK_RSA.3072" = { answer = "yes" }
"generate.CKK_RSA.4096" = { answer = "no" }
"decrypt.rsa-oaep.SHA-1" = { answer = "yes" }
"decrypt.rsa-oaep.SHA-256" = { answer = "yes" }
"decrypt.rsa-oaep.SHA-512" = { answer = "yes" }
"derive.ecdh.sealed" = { answer = "no" }
"derive.ecdh.read-only" = { answer = "no" }
"move.export" = { answer = "no" }
"move.unwrap" = { answer = "no" }

[reported."CKK_RSA"]
min-bits = 1024
max-bits = 3072

[migration]
plaintext-import = "tpm2-ptool"

[[migration.public-accepts]]
class = "CKO_CERTIFICATE"

[[migration.public-accepts]]
class = "CKO_PUBLIC_KEY"
key-types = ["CKK_RSA"]

[[migration.plaintext-accepts]]
class = "CKO_PRIVATE_KEY"
key-types = ["CKK_EC"]
curves = ["secp256r1", "secp384r1"]

[[migration.plaintext-accepts]]
class = "CKO_PRIVATE_KEY"
key-types = ["CKK_RSA"]
min-bits = 1024
max-bits = 3072

[[migration.plaintext-accepts]]
class = "CKO_SECRET_KEY"
key-types = ["CKK_SHA_1_HMAC", "CKK_SHA224_HMAC", "CKK_SHA256_HMAC", "CKK_SHA384_HMAC", "CKK_SHA512_HMAC"]

[notes]
"CKK_RSA at 4096" = "modulusBits = 4096: CKR_ATTRIBUTE_VALUE_INVALID"
"CKM_AES_KEY_GEN" = "advertised but generation fails: CKR_FUNCTION_NOT_SUPPORTED"
"brainpoolP256r1" = "generation refused: CKR_CURVE_NOT_SUPPORTED"
"brainpoolP384r1" = "generation refused: CKR_CURVE_NOT_SUPPORTED"
"cryptoki" = "the module reports Cryptoki 2.40"
"curve25519" = "not advertised: CKM_EC_MONTGOMERY_KEY_PAIR_GEN"
"curve448" = "not advertised: CKM_EC_MONTGOMERY_KEY_PAIR_GEN"
"derive.destroy" = "secp256r1: the sealed derived secret cannot be destroyed: CKR_FUNCTION_FAILED"
"derive.read-only" = "secp256r1: in a read-only session: CKR_SESSION_READ_ONLY"
"derive.sealed" = "derives into a sealed secret, but HMAC with it fails: CKR_GENERAL_ERROR"
"destroy" = "C_DestroyObject leaves objects behind: cakeys-probe-01"
"edwards25519" = "not advertised: CKM_EC_EDWARDS_KEY_PAIR_GEN"
"edwards448" = "not advertised: CKM_EC_EDWARDS_KEY_PAIR_GEN"
"secp256k1" = "generation refused: CKR_CURVE_NOT_SUPPORTED"

[manual."data-objects"]
finding = "tpm2-pkcs11 creates a data object only with CKA_PRIVATE = true (it seals CKA_VALUE), and camigrate moves no private data object (cakeys identifies one only when its spec declares CKA_PRIVATE = true: a value hash in the lock would let anyone guess a guessable value offline). So no public-accepts row for CKO_DATA: a data object cannot move to this module."
evidence = "[src] tpm2-pkcs11 1.10.1 src/lib/object.c handle_data_object: 'CKA_PRIVATE cannot be CK_FALSE' (CKR_ATTRIBUTE_VALUE_INVALID); [run] crates/camigrate/tests/dry_run.rs planting a public data object on swtpm, 2026-11-14"
