# Generated by `caprobe probe` (docs/CAPROBE.md). Never edit: regenerate
# with `caprobe probe --token <t> --write --diff <profile> --out <this file>`; the
# conformance test re-probes and compares on every build. A profile is what the
# probe measured: this module on this token's hardware, together. Only [migration]
# and [manual] are not probe output: this repo's claims and hand findings,
# preserved across regenerations.
profile = "tpm2-pkcs11/1.10+amd-ftpm"
mode = "observed"
advertise = [
  "CKM_AES_CBC",
  "CKM_AES_CBC_PAD",
  "CKM_AES_CFB128",
  "CKM_AES_CTR",
  "CKM_AES_ECB",
  "CKM_AES_KEY_GEN",
  "CKM_ECDH1_DERIVE",
  "CKM_ECDSA",
  "CKM_ECDSA_SHA1",
  "CKM_ECDSA_SHA256",
  "CKM_ECDSA_SHA384",
  "CKM_ECDSA_SHA512",
  "CKM_EC_KEY_PAIR_GEN",
  "CKM_RSA_PKCS",
  "CKM_RSA_PKCS_KEY_PAIR_GEN",
  "CKM_RSA_PKCS_OAEP",
  "CKM_RSA_PKCS_PSS",
  "CKM_RSA_X_509",
  "CKM_SHA1_RSA_PKCS",
  "CKM_SHA1_RSA_PKCS_PSS",
  "CKM_SHA256",
  "CKM_SHA256_HMAC",
  "CKM_SHA256_RSA_PKCS",
  "CKM_SHA256_RSA_PKCS_PSS",
  "CKM_SHA384",
  "CKM_SHA384_RSA_PKCS_PSS",
  "CKM_SHA512",
  "CKM_SHA512_RSA_PKCS_PSS",
  "CKM_SHA_1",
  "CKM_SHA_1_HMAC",
]

[match]
manufacturer = "tpm2-software.github.io"
module-version = "1.10"
model = "AMD"
firmware = "3.87"

[decrypt]
oaep = ["SHA-1", "SHA-256"]

[derive]
sealed = false
key-attribute = true
read-only = false

[subtract]
mechanisms = [
  "CKM_AES_KEY_GEN",
  "CKM_ECDSA_SHA384",
  "CKM_ECDSA_SHA512",
  "CKM_SHA384_RSA_PKCS_PSS",
  "CKM_SHA512_RSA_PKCS_PSS",
]

[generate."CKK_EC"]
can = ["secp256r1", "secp384r1"]
cannot = ["secp521r1", "secp256k1", "brainpoolP256r1", "brainpoolP384r1"]

[generate."CKK_EC_EDWARDS"]
cannot = ["edwards25519", "edwards448"]

[generate."CKK_EC_MONTGOMERY"]
cannot = ["curve25519", "curve448"]

[generate."CKK_RSA"]
min-bits = 1024
max-bits = 2048
can-bits = [1024, 2048]
cannot-bits = [3072, 4096]

[migration]
exports = false
unwraps = false
plaintext-import = "tpm2-ptool"

[[migration.public-accepts]]
class = "CKO_CERTIFICATE"

[[migration.public-accepts]]
class = "CKO_PUBLIC_KEY"
key-types = ["CKK_RSA"]

[[migration.plaintext-accepts]]
class = "CKO_PRIVATE_KEY"
key-types = ["CKK_EC"]
curves = ["secp256r1", "secp384r1"]

[[migration.plaintext-accepts]]
class = "CKO_PRIVATE_KEY"
key-types = ["CKK_RSA"]
min-bits = 1024
max-bits = 2048

[[migration.plaintext-accepts]]
class = "CKO_SECRET_KEY"
key-types = ["CKK_SHA_1_HMAC", "CKK_SHA256_HMAC"]

[notes]
"CKK_RSA at 3072" = "modulusBits = 3072: CKR_ATTRIBUTE_VALUE_INVALID"
"CKK_RSA at 4096" = "modulusBits = 4096: CKR_ATTRIBUTE_VALUE_INVALID"
"CKM_AES_KEY_GEN" = "advertised but generation fails: CKR_FUNCTION_NOT_SUPPORTED"
"CKM_ECDSA_SHA384" = "secp256r1: CKR_GENERAL_ERROR"
"CKM_ECDSA_SHA512" = "secp256r1: CKR_GENERAL_ERROR"
"CKM_SHA384_RSA_PKCS_PSS" = "RSA-2048: CKR_GENERAL_ERROR"
"CKM_SHA512_RSA_PKCS_PSS" = "RSA-2048: CKR_GENERAL_ERROR"
"brainpoolP256r1" = "generation refused: CKR_CURVE_NOT_SUPPORTED"
"brainpoolP384r1" = "generation refused: CKR_CURVE_NOT_SUPPORTED"
"cryptoki" = "the module reports Cryptoki 2.40"
"curve25519" = "generation refused: CKR_MECHANISM_INVALID"
"curve448" = "generation refused: CKR_MECHANISM_INVALID"
"derive.destroy" = "secp256r1: the sealed derived secret cannot be destroyed: CKR_FUNCTION_FAILED"
"derive.read-only" = "secp256r1: in a read-only session: CKR_SESSION_READ_ONLY"
"derive.sealed" = "derives into a sealed secret, but HMAC with it fails: CKR_GENERAL_ERROR"
"destroy" = "C_DestroyObject leaves objects behind: cakeys-probe-01"
"edwards25519" = "generation refused: CKR_MECHANISM_INVALID"
"edwards448" = "generation refused: CKR_MECHANISM_INVALID"
"secp256k1" = "generation refused: CKR_CURVE_NOT_SUPPORTED"
"secp521r1" = "generation refused: CKR_GENERAL_ERROR"

[manual."data-objects"]
finding = "tpm2-pkcs11 creates a data object only with CKA_PRIVATE = true (it seals CKA_VALUE), and cakeys identifies only public data objects (a value hash in the lock would let anyone guess a private value offline). So no public-accepts row for CKO_DATA: a data object cannot move to this module."
evidence = "[src] tpm2-pkcs11 1.10.1 src/lib/object.c handle_data_object: 'CKA_PRIVATE cannot be CK_FALSE' (CKR_ATTRIBUTE_VALUE_INVALID); [run] crates/camigrate/tests/dry_run.rs planting a public data object on swtpm, 2026-11-14"

[manual."hash-algorithms"]
finding = "The TPM implements SHA-1 and SHA-256 only (no SHA-384 or SHA-512; PCR banks sha1 and sha256), which is why tpm2-pkcs11's SHA-384/512 ECDSA and RSA-PSS fail here with 'structure is the wrong size' from TPM2_Sign. Its curves are NIST P-256, P-384 and BN-P256 (which cakeys does not name). The [migration] rows are claims sized to this, not tested: tpm2_ptool import of P-384, RSA-2048 and SHA-1/SHA-256 HMAC keys."
evidence = "[run] `tpm2_getcap algorithms`, `ecc-curves`, `pcrs` on an AMD Ryzen 7 5700G fTPM (TPM2_PT_MANUFACTURER AMD, firmware 3.87.0.5), 2026-11-13"

[manual."resource-manager"]
finding = "Through the kernel resource manager alone (TCTI device:/dev/tpmrm0), the write probe exhausts its 3 transient-object slots per connection: tpm2-pkcs11 keeps objects loaded, and the ones it cannot destroy after a failed C_SignInit (derive.destroy) are never flushed. The kernel logs 'out of slots', every later ESAPI call fails, and the probe would record false refusals. Probed through a private tpm2-abrmd over /dev/tpmrm0, which swaps objects in and out, like the swtpm harness. The probe regenerates identically only on a fresh store: an earlier run's undestroyable objects change what the next one can do."
evidence = "[run] kernel log 'tpm2_map_response_header: out of slots for 0x80000003' and Esys 'tcti:IO failure' then 'Function called in the wrong order', 2026-11-13; four runs compared"

[manual."store"]
finding = "Probed on a dedicated tpm2-pkcs11 store created with `tpm2_ptool init --transient-parent tpm2-tools-ecc-default`: nothing persistent or in NV on the TPM, the platform's own handles (0x81000001, 0x81000002, the EK 0x81010001) and its NV indices untouched, and no wrong PIN tried (DA lockout counter 0 before and after). The tpm-certify attestation needs a persistent primary, so it is not available on such a store and was not tested here."
evidence = "[run] tpm2_getcap handles-persistent, handles-nv-index and properties-variable before and after, 2026-11-13; crates/tpm2-pkcs11/src/attest/store.rs parse_parent"

[manual."unwraps"]
finding = "C_UnwrapKey is CKR_FUNCTION_NOT_SUPPORTED, though key generation accepts CKA_UNWRAP = true: an unwrap-only RSA key generates, and its pop-unwrap proof then fails. So binding = \"pop-unwrap\" is refused (15) before anything is generated; a tpm2-pkcs11 transport key would prove possession with pop-decrypt, and no sealed import reaches this module anyway (unwraps = false)."
evidence = "[run] crates/cli/tests/ftpm.rs unwrap_only_keys_cannot_prove_possession on the AMD fTPM (firmware 3.87.0.5) through nix/ftpm-test-env.sh, before the up-front refusal, 2026-11-13: persistent handles and DA lockout counter (0) unchanged"
