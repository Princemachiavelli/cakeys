# Generated by `caprobe probe` (docs/CAPROBE.md). Never edit: regenerate
# with `caprobe probe --token <t> --write --diff <profile> --out <this file>`; the
# conformance test re-probes and compares on every build. A profile is what the
# probe measured: this module on this token's hardware, together. Only [migration]
# and [manual] are not probe output: this repo's claims and hand findings,
# preserved across regenerations.
profile = "kmsp11/1.9+hsm-fips"
mode = "observed"
advertise = [
  "CKM_AES_CBC",
  "CKM_AES_CBC_PAD",
  "CKM_AES_CTR",
  "CKM_AES_KEY_GEN",
  "CKM_ECDSA",
  "CKM_ECDSA_SHA256",
  "CKM_ECDSA_SHA384",
  "CKM_EC_KEY_PAIR_GEN",
  "CKM_GENERIC_SECRET_KEY_GEN",
  "CKM_RSA_PKCS",
  "CKM_RSA_PKCS_KEY_PAIR_GEN",
  "CKM_RSA_PKCS_OAEP",
  "CKM_RSA_PKCS_PSS",
  "CKM_SHA224_HMAC",
  "CKM_SHA256_HMAC",
  "CKM_SHA256_RSA_PKCS",
  "CKM_SHA256_RSA_PKCS_PSS",
  "CKM_SHA384_HMAC",
  "CKM_SHA512_HMAC",
  "CKM_SHA512_RSA_PKCS",
  "CKM_SHA512_RSA_PKCS_PSS",
  "CKM_SHA_1_HMAC",
]

[match]
manufacturer = "Google"
module-version = "1.9"
model = "Cloud KMS Token"
firmware = "0.0"

[decrypt]
oaep = ["SHA-256", "SHA-512"]

[generate."CKK_EC"]
can = ["secp256r1", "secp384r1"]
cannot = ["secp521r1", "secp256k1", "brainpoolP256r1", "brainpoolP384r1"]

[generate."CKK_EC_EDWARDS"]
cannot = ["edwards25519", "edwards448"]

[generate."CKK_EC_MONTGOMERY"]
cannot = ["curve25519", "curve448"]

[generate."CKK_RSA"]
min-bits = 2048
max-bits = 4096
can-bits = [2048, 3072, 4096]
cannot-bits = [1024]

[notes]
"CKK_RSA at 1024" = "no binding for it; without one: CKR_TEMPLATE_INCOMPLETE"
"CKM_RSA_PKCS" = "RSA_SIGN_PKCS1_2048_SHA256 decrypt: CKR_MECHANISM_INVALID; RSA_SIGN_PKCS1_3072_SHA256 decrypt: CKR_MECHANISM_INVALID; RSA_SIGN_PKCS1_4096_SHA256 decrypt: CKR_MECHANISM_INVALID; RSA_SIGN_PKCS1_4096_SHA512: CKR_DATA_INVALID; RSA_SIGN_PKCS1_4096_SHA512 decrypt: CKR_MECHANISM_INVALID; RSA_SIGN_RAW_PKCS1_2048 decrypt: CKR_MECHANISM_INVALID; RSA_SIGN_RAW_PKCS1_3072 decrypt: CKR_MECHANISM_INVALID; RSA_SIGN_RAW_PKCS1_4096 decrypt: CKR_MECHANISM_INVALID"
"CKM_RSA_PKCS_OAEP" = "RSA_DECRYPT_OAEP_2048_SHA256 decrypt SHA-1: CKR_MECHANISM_PARAM_INVALID; RSA_DECRYPT_OAEP_2048_SHA256 decrypt SHA-512: CKR_MECHANISM_PARAM_INVALID; RSA_DECRYPT_OAEP_3072_SHA256 decrypt SHA-1: CKR_MECHANISM_PARAM_INVALID; RSA_DECRYPT_OAEP_3072_SHA256 decrypt SHA-512: CKR_MECHANISM_PARAM_INVALID; RSA_DECRYPT_OAEP_4096_SHA256 decrypt SHA-1: CKR_MECHANISM_PARAM_INVALID; RSA_DECRYPT_OAEP_4096_SHA256 decrypt SHA-512: CKR_MECHANISM_PARAM_INVALID; RSA_DECRYPT_OAEP_4096_SHA512 decrypt SHA-1: CKR_MECHANISM_PARAM_INVALID; RSA_DECRYPT_OAEP_4096_SHA512 decrypt SHA-256: CKR_MECHANISM_PARAM_INVALID"
"CKM_RSA_PKCS_PSS" = "RSA_SIGN_PSS_4096_SHA512: CKR_MECHANISM_PARAM_INVALID"
"brainpoolP256r1" = "no binding for it; without one: CKR_TEMPLATE_INCOMPLETE"
"brainpoolP384r1" = "no binding for it; without one: CKR_TEMPLATE_INCOMPLETE"
"cryptoki" = "the module reports Cryptoki 2.40"
"curve25519" = "no binding for it; without one: CKR_MECHANISM_INVALID"
"curve448" = "no binding for it; without one: CKR_MECHANISM_INVALID"
"edwards25519" = "no binding for it; without one: CKR_MECHANISM_INVALID"
"edwards448" = "no binding for it; without one: CKR_MECHANISM_INVALID"
"mechanism-list" = "C_GetMechanismList repeats CKM_RSA_PKCS_KEY_PAIR_GEN 24 times"
"purpose-bound" = "each key is bound to one purpose at creation (kmsp11 keys): one key per binding, each probed with its own mechanisms"
"secp256k1" = "no binding for it; without one: CKR_TEMPLATE_INCOMPLETE"
"secp521r1" = "no binding for it; without one: CKR_TEMPLATE_INCOMPLETE"
