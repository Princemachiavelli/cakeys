[match]
manufacturer = "Kryoptic"
model = "v1"
firmware = "1.5"

[wrap]
oaep = ["SHA-1", "SHA-256"]

[unwrap]
refuse = []

[decrypt]
oaep = ["SHA-1", "SHA-256"]

[derive]
sealed = true
key-attribute = true
read-only = true

[generate."CKK_EC"]
can = ["secp256r1", "secp384r1", "secp521r1"]
cannot = ["secp256k1", "brainpoolP256r1", "brainpoolP384r1"]

[generate."CKK_EC_EDWARDS"]
can = ["edwards25519", "edwards448"]

[generate."CKK_EC_MONTGOMERY"]
can = ["curve25519", "curve448"]

[generate."CKK_RSA"]
min-bits = 1024
max-bits = 16384
can-bits = [1024, 2048, 3072, 4096]

[notes]
"brainpoolP256r1" = "generation refused: CKR_GENERAL_ERROR"
"brainpoolP384r1" = "generation refused: CKR_GENERAL_ERROR"
"cryptoki" = "the module reports Cryptoki 3.2"
"secp256k1" = "generation refused: CKR_GENERAL_ERROR"
