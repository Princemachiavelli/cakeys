profile = "aws-cloudhsm/5.18+hsm2m-non-fips"
mode = "observed"
advertise = [
  "CKM_AES_CBC",
  "CKM_AES_CBC_PAD",
  "CKM_AES_CMAC",
  "CKM_AES_CTR",
  "CKM_AES_ECB",
  "CKM_AES_GCM",
  "CKM_AES_KEY_GEN",
  "CKM_AES_KEY_WRAP",
  "CKM_AES_KEY_WRAP_PAD",
  "CKM_DES3_ECB",
  "CKM_DES3_KEY_GEN",
  "CKM_ECDH1_DERIVE",
  "CKM_ECDSA",
  "CKM_ECDSA_SHA1",
  "CKM_ECDSA_SHA256",
  "CKM_ECDSA_SHA384",
  "CKM_ECDSA_SHA512",
  "CKM_EC_KEY_PAIR_GEN",
  "CKM_GENERIC_SECRET_KEY_GEN",
  "CKM_RSA_AES_KEY_WRAP",
  "CKM_RSA_PKCS",
  "CKM_RSA_PKCS_KEY_PAIR_GEN",
  "CKM_RSA_PKCS_OAEP",
  "CKM_RSA_PKCS_PSS",
  "CKM_RSA_X_509",
  "CKM_SHA1_RSA_PKCS",
  "CKM_SHA1_RSA_PKCS_PSS",
  "CKM_SHA224_HMAC",
  "CKM_SHA256",
  "CKM_SHA256_HMAC",
  "CKM_SHA256_RSA_PKCS",
  "CKM_SHA256_RSA_PKCS_PSS",
  "CKM_SHA384",
  "CKM_SHA384_HMAC",
  "CKM_SHA384_RSA_PKCS",
  "CKM_SHA384_RSA_PKCS_PSS",
  "CKM_SHA512",
  "CKM_SHA512_HMAC",
  "CKM_SHA512_RSA_PKCS",
  "CKM_SHA512_RSA_PKCS_PSS",
  "CKM_SHA_1",
  "CKM_SHA_1_HMAC",
]
add = ["CKM_EC_EDWARDS_KEY_PAIR_GEN", "CKM_EDDSA"]

[match]
manufacturer = "CloudHSM"
module-version = "5.18"
model = "LS2"
firmware = "10.23"

[wrap]
oaep = ["SHA-1", "SHA-256"]

[decrypt]
oaep = ["SHA-1", "SHA-256", "SHA-512"]

[derive]
sealed = true
key-attribute = true
read-only = false

[subtract]
mechanisms = ["CKM_AES_KEY_WRAP", "CKM_AES_KEY_WRAP_PAD"]

[generate."CKK_EC"]
can = ["secp256r1", "secp384r1", "secp521r1", "secp256k1"]
cannot = ["brainpoolP256r1", "brainpoolP384r1"]

[generate."CKK_EC_EDWARDS"]
can = ["edwards25519"]
cannot = ["edwards448"]

[generate."CKK_EC_MONTGOMERY"]
cannot = ["curve25519", "curve448"]

[generate."CKK_RSA"]
min-bits = 2048
max-bits = 4096
can-bits = [2048, 3072, 4096]
cannot-bits = [1024]

[migration]

[[migration.refuses]]
class = "CKO_PRIVATE_KEY"
key-types = ["CKK_EC_EDWARDS"]

[notes]
"CKK_RSA at 1024" = "modulusBits = 1024: CKR_ATTRIBUTE_VALUE_INVALID"
"CKM_AES_KEY_WRAP" = "advertised but refused: C_WrapKey: CKR_MECHANISM_INVALID"
"CKM_AES_KEY_WRAP_PAD" = "advertised but refused: C_WrapKey: CKR_MECHANISM_INVALID"
"CKM_EC_EDWARDS_KEY_PAIR_GEN" = "not listed; generates through the provider's stand-in, CKM_EC_KEY_PAIR_GEN"
"CKM_EDDSA" = "not listed; signs through the provider's stand-in, 0x80001057"
"brainpoolP256r1" = "generation refused: CKR_ATTRIBUTE_VALUE_INVALID"
"brainpoolP384r1" = "generation refused: CKR_ATTRIBUTE_VALUE_INVALID"
"cryptoki" = "the module reports Cryptoki 2.40"
"curve25519" = "not advertised: CKM_EC_MONTGOMERY_KEY_PAIR_GEN"
"curve448" = "not advertised: CKM_EC_MONTGOMERY_KEY_PAIR_GEN"
"derive.read-only" = "secp256r1: in a read-only session: CKR_SESSION_READ_ONLY"
"derive.secret" = "secp256r1: the derived secret reports CKA_SENSITIVE = true, CKA_EXTRACTABLE = true"
"derive.template" = "secp256r1: the template as asked is refused (CKR_ATTRIBUTE_VALUE_INVALID); derived with CKA_VALUE_LEN = 32 added, CKA_EXTRACTABLE = false dropped"
"edwards448" = "generation refused: CKR_ATTRIBUTE_VALUE_INVALID"
"template.public.CKA_PRIVATE" = "CKA_PRIVATE = false on a public object: CKR_ATTRIBUTE_VALUE_INVALID; made without it, the object reads CKA_PRIVATE = true"
"unwrap-template" = "CKA_VALUE_LEN: CKR_ATTRIBUTE_TYPE_INVALID"

[manual."ed25519"]
finding = "Ed25519 is the aws-cloudhsm provider's: generated by CKM_EC_KEY_PAIR_GEN with the Ed25519 OID, reported CKK_EC with the whole SPKI as CKA_EC_POINT, signed (pure) by the vendor CKM_CLOUDHSM_EDDSA 0x80001057, no parameters; the add rows are the probe's. An Ed25519 key moves out (camigrate, CKM_RSA_AES_KEY_WRAP) but never in: the public half's C_CreateObject with CKK_EC_EDWARDS is CKR_ATTRIBUTE_VALUE_INVALID, hence migration.refuses."
evidence = "[run] PyKCS11 and python-pkcs11 scripts on the NON_FIPS cluster, us-west-1, 2026-11-14 (not kept): the generation, the 44-byte SPKI, a 64-byte signature that verifies as RFC 8032 Ed25519; [run] cakeys create/verify ed25519 and camigrate migrate both ways (crates/cli/tests/cloud.rs, a hand run for the move in), 2026-11-14"
