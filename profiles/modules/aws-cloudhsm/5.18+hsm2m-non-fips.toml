profile = "aws-cloudhsm/5.18+hsm2m-non-fips"
mode = "observed"
advertise = [
  "CKM_AES_CBC",
  "CKM_AES_CBC_PAD",
  "CKM_AES_CMAC",
  "CKM_AES_CTR",
  "CKM_AES_ECB",
  "CKM_AES_GCM",
  "CKM_AES_KEY_GEN",
  "CKM_AES_KEY_WRAP",
  "CKM_AES_KEY_WRAP_PAD",
  "CKM_DES3_ECB",
  "CKM_DES3_KEY_GEN",
  "CKM_ECDH1_DERIVE",
  "CKM_ECDSA",
  "CKM_ECDSA_SHA1",
  "CKM_ECDSA_SHA256",
  "CKM_ECDSA_SHA384",
  "CKM_ECDSA_SHA512",
  "CKM_EC_KEY_PAIR_GEN",
  "CKM_GENERIC_SECRET_KEY_GEN",
  "CKM_RSA_AES_KEY_WRAP",
  "CKM_RSA_PKCS",
  "CKM_RSA_PKCS_KEY_PAIR_GEN",
  "CKM_RSA_PKCS_OAEP",
  "CKM_RSA_PKCS_PSS",
  "CKM_RSA_X_509",
  "CKM_SHA1_RSA_PKCS",
  "CKM_SHA1_RSA_PKCS_PSS",
  "CKM_SHA224_HMAC",
  "CKM_SHA256",
  "CKM_SHA256_HMAC",
  "CKM_SHA256_RSA_PKCS",
  "CKM_SHA256_RSA_PKCS_PSS",
  "CKM_SHA384",
  "CKM_SHA384_HMAC",
  "CKM_SHA384_RSA_PKCS",
  "CKM_SHA384_RSA_PKCS_PSS",
  "CKM_SHA512",
  "CKM_SHA512_HMAC",
  "CKM_SHA512_RSA_PKCS",
  "CKM_SHA512_RSA_PKCS_PSS",
  "CKM_SHA_1",
  "CKM_SHA_1_HMAC",
]

[match]
manufacturer = "CloudHSM"
module-version = "5.18"
model = "LS2"
firmware = "10.23"

[wrap]
oaep = ["SHA-1", "SHA-256"]

[decrypt]
oaep = ["SHA-1", "SHA-256"]

[subtract]
mechanisms = ["CKM_ECDH1_DERIVE"]

[generate."CKK_EC"]
can = ["secp256r1", "secp384r1", "secp521r1", "secp256k1"]
cannot = ["brainpoolP256r1", "brainpoolP384r1"]

[generate."CKK_EC_EDWARDS"]
cannot = ["edwards25519", "edwards448"]

[generate."CKK_EC_MONTGOMERY"]
cannot = ["curve25519", "curve448"]

[generate."CKK_RSA"]
min-bits = 2048
max-bits = 4096
can-bits = [2048, 3072, 4096]
cannot-bits = [1024]

[notes]
"CKK_RSA at 1024" = "modulusBits = 1024: CKR_ATTRIBUTE_VALUE_INVALID"
"CKM_ECDH1_DERIVE" = "secp256r1: a sealed (non-extractable) derived secret is refused: CKR_ATTRIBUTE_VALUE_INVALID; extractable: CKR_ATTRIBUTE_VALUE_INVALID"
"brainpoolP256r1" = "generation refused: CKR_ATTRIBUTE_VALUE_INVALID"
"brainpoolP384r1" = "generation refused: CKR_ATTRIBUTE_VALUE_INVALID"
"cryptoki" = "the module reports Cryptoki 2.40"
"curve25519" = "generation refused: CKR_MECHANISM_INVALID"
"curve448" = "generation refused: CKR_MECHANISM_INVALID"
"edwards25519" = "generation refused: CKR_MECHANISM_INVALID"
"edwards448" = "generation refused: CKR_MECHANISM_INVALID"
"public-private" = "a public key with CKA_PRIVATE = false: CKR_ATTRIBUTE_VALUE_INVALID; generated without it, the public key reads CKA_PRIVATE = true"
"unwrap-template" = "CKA_VALUE_LEN: CKR_ATTRIBUTE_TYPE_INVALID"
