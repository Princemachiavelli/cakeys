profile = "aws-cloudhsm/5.18+hsm2m-fips"
mode = "observed"
advertise = [
  "CKM_AES_CBC",
  "CKM_AES_CBC_PAD",
  "CKM_AES_CMAC",
  "CKM_AES_CTR",
  "CKM_AES_ECB",
  "CKM_AES_GCM",
  "CKM_AES_KEY_GEN",
  "CKM_AES_KEY_WRAP",
  "CKM_AES_KEY_WRAP_PAD",
  "CKM_DES3_ECB",
  "CKM_DES3_KEY_GEN",
  "CKM_ECDH1_DERIVE",
  "CKM_ECDSA",
  "CKM_ECDSA_SHA1",
  "CKM_ECDSA_SHA256",
  "CKM_ECDSA_SHA384",
  "CKM_ECDSA_SHA512",
  "CKM_EC_KEY_PAIR_GEN",
  "CKM_GENERIC_SECRET_KEY_GEN",
  "CKM_RSA_AES_KEY_WRAP",
  "CKM_RSA_PKCS",
  "CKM_RSA_PKCS_KEY_PAIR_GEN",
  "CKM_RSA_PKCS_OAEP",
  "CKM_RSA_PKCS_PSS",
  "CKM_RSA_X_509",
  "CKM_SHA1_RSA_PKCS",
  "CKM_SHA1_RSA_PKCS_PSS",
  "CKM_SHA224_HMAC",
  "CKM_SHA256",
  "CKM_SHA256_HMAC",
  "CKM_SHA256_RSA_PKCS",
  "CKM_SHA256_RSA_PKCS_PSS",
  "CKM_SHA384",
