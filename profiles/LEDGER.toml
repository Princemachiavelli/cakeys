why = "the probe's D-2, D-3, D-5 and D-11 logic (review 2026-11-23: fce5432, 61b7000) and the token operations changed after the probe; rows the old logic wrote stand unchecked: the add row CKM_ECDSA_SHA224, and the import rows refused with CKR_DEVICE_ERROR (review 2026-11-24 E-2) Renewed at the p0-gate merge: rustfmt of the files 8aaba2e left unformatted (16a7d14), doc comments (29cc929) and the cloud scripts' --new-lock (4f5a314) changed the watched files; no probe behaviour changed, and the re-probe above is still owed. Renewed by P1 (review 2026-11-24 phase 1, the cakeys plan): step 1 moved Token::unsupported_for's provider hint into provider.rs (`hinted`), same text, return value and kind, now also carrying the refusing rule's name; step 2 made Token::create ask placement and the destroys ask the provider's new static `deletion` answer, then enter the SO session, before the provider's create or destroy (Checked requests; as_so re-entrant): ykcs11's create and destroy overrides are gone, its key-delete refusal now its `deletion` answer, same text and code, still before any SO login; step 4 gave a lock realisation a reader of its recorded flags (`observed`), which `needs-login` asks: a session without login now ends 16 where it once reported an object it cannot see absent; step 5 made every destroy look under the locator again (what is still there is 16, never claimed), `delete` read the module profile's delete.<class> row and `deletion` before destroying (15), and every login read C_GetSessionInfo (16 when the session does not show the login). The probe's creations through Token::create ask placement, which only ykcs11 refuses (its override did, at the same point), and its scratch slot is a PIV CKA_ID; caprobe counts what C_DestroyObject leaves with its own search, unchanged; a module whose C_GetSessionInfo does not show a login it accepted now stops a run (16) where it once ran in a public session, which only a re-probe shows; the lock's format and values are unchanged: no probe row or lock value can change, and the re-probe above is still owed."
reprobe = "the whole profile, by the regen command"

