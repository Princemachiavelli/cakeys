code-hash = "sha256:c4a9b9311001ceaeff9db1098714a6036fd9f547dd7c9f96168a47dab3eba42c"
by = "review 2026-11-24 E-7 (the ledger's first entry)"
why = "the probe's D-2, D-3, D-5 and D-11 logic (review 2026-11-23: fce5432, 61b7000) and the token operations changed after the probe; rows the old logic wrote stand unchecked: the add row CKM_ECDSA_SHA224, and the import rows refused with CKR_DEVICE_ERROR (review 2026-11-24 E-2) Renewed at the p0-gate merge: rustfmt of the files 8aaba2e left unformatted (16a7d14), doc comments (29cc929) and the cloud scripts' --new-lock (4f5a314) changed the watched files; no probe behaviour changed, and the re-probe above is still owed. Renewed by P1 (review 2026-11-24 phase 1, the cakeys plan): step 1 moved Token::unsupported_for's provider hint into provider.rs (`hinted`), same text, return value and kind, now also carrying the refusing rule's name; step 2 made Token::create ask placement and the destroys ask the provider's new static `deletion` answer, then enter the SO session, before the provider's create or destroy (Checked requests; as_so re-entrant): ykcs11's create and destroy overrides are gone, its key-delete refusal now its `deletion` answer, same text and code, still before any SO login; step 4 gave a lock realisation a reader of its recorded flags (`observed`), which `needs-login` asks: a session without login now ends 16 where it once reported an object it cannot see absent; step 5 made every destroy look under the locator again (what is still there is 16, never claimed), `delete` read the module profile's delete.<class> row and `deletion` before destroying (15), and every login read C_GetSessionInfo (16 when the session does not show the login). step 7 gave token/rv.rs's device-failure list a reader by return value (`device_failed_rv`, the same list, for the rows' `device` field), what the probe classifies unchanged. A-7 checks ykcs11's PIV slot link with chain::link, every rule of the walk's links, where it checked the signature alone: a device or slot certificate that broke a chain rule was accepted before and is refused now; a valid chain verifies as before. B-3 checks what Provider::template returns (a security attribute changed but to tighten it is refused, 17) and asks policy_flag only of the pairs a provider's repairs() declares (ykcs11: CKA_DERIVE of EC and X25519 private keys, the reads it repaired before); no in-tree provider's template changes a security attribute, so what the probe measures is unchanged. B-8 types the session templates (templates::SessionTemplate, the same attributes, pinned per key). The probe's creations through Token::create ask placement, which only ykcs11 refuses (its override did, at the same point), and its scratch slot is a PIV CKA_ID; caprobe counts what C_DestroyObject leaves with its own search, unchanged; a module whose C_GetSessionInfo does not show a login it accepted now stops a run (16) where it once ran in a public session, which only a re-probe shows; the lock's format and values are unchanged: no probe row or lock value can change, and the re-probe above is still owed. Renewed by P3 (review 2026-11-24 phase 1, probe provenance): every row the probe writes says `by` (host, module, unverified); a device, token or session failure (DEVICE_FAILED_RV, the 11 names token/rv.rs had, now in cakeys-profile) and a refusal of cakeys' own write no row but an [untested] entry (why device or cakeys); signatures the host cannot verify are [untested] unverified (E-4); wrap.rsa-oaep rows are no longer written from an unwrap's failure; a bound-key generation no binding names is an [untested] cakeys entry (E-5); the registry refuses a code family without its code (B-7, B-10). Read back, this file's rows are legacy: they decide as before, but a no citing a device failure is unknown and refused (15) naming the re-probe, and verdicts note legacy rows. A re-probe would write `by` on every row and move those rows into [untested]; the re-probe above is still owed. Renewed by P2 (review 2026-11-24 phase 1, camigrate): step 12 made Token::extract return ops::Extracted, the same bytes under a type that only ops::check_identity turns into what camigrate writes (D-5), and added ops::identity, the host's own commitments of a secret key, with their RustCrypto dependencies; caprobe's export.host compares what arrived as before: no probe row or lock value can change, and the re-probe above is still owed. Renewed by L6 (review 2026-11-24 phase 2, independent oracles): `probe --out` writes the generated profile beside a file it differs from, as <file>.new, unless --accept (cakeys_profile::regenerate, review 2026-11-24 C-8); what the probe measures and the profile it emits are unchanged, and the re-probe above is still owed. Renewed again at the merge of P2 and L6 into review-2026-11-24: the hash of both changes together, no other code. Renewed by L4a-fixes (review 2026-11-24 phase 2, the liar matrix's L4a-1): a module error that says the device, the token or the session failed (device_failed_rv) is unavailable (16) through one mapping (token/rv.rs refused_unless_device, Token::refused_for) where Token::commit, wrap-rebind, Token::extract, the host key's create, the trusted transport copy and the by-name generation said unsupported (15), as generation already did; each error carries the same return value as before, by which caprobe classes its rows (Refusal::of): no probe row or lock value can change, and the re-probe above is still owed. Renewed by L4a-fixes (review 2026-11-24 phase 2, the liar matrix's L4a-3): token/login.rs session() asks one decision, read_write, for the session it opens, and a new Access::DryWrite, the dry run of a write, opens read-only and is refused (15) on a write-protected token as Write is; Read, Write and Scratch open the sessions they did, and caprobe opens Read or Write: no probe row or lock value can change, and the re-probe above is still owed. Renewed again at the merge of L4a-fixes into review-2026-11-24 (after P2 and L6): the hash of those changes together, no other code. Renewed by L5 (review 2026-11-24 phase 2, the attestation forgery kit): attest.rs's test module gained the forged-chain tests (B-11), over fixtures of their own; no code outside the tests changed, so no probe row or lock value can change, and the re-probe above is still owed. Renewed again at the merge of L5 into review-2026-11-24 (after P2, L6, L4a-fixes): the hash of those changes together, no other code. Renewed by L4b (review 2026-11-24, phase 2). The probe now wraps each sealed export with the imported rsa-2048 test key, and the host decodes each wrapped blob (finding E-3). An export.sealed.* row is a yes by = host only when the host recovers the value of the key, and it is a no by = host when the host cannot decode any blob that the module wrapped. An unwrap.* row is by = unverified when the module unwrapped only blobs that the host could not decode. When the module refuses to import the test key, the probe wraps toward a generated key pair as before, and its sealed rows are by = unverified. The probe of CKA_VALUE_LEN in an unwrap template now unwraps into a session object, so that it leaves no object on the token (L4b-5). Only the constructors in crates/caprobe/src/probe/checked.rs can mark a probe row as verified. The probe now marks the scratch slot with a certificate issued over each key in the slot, and the guard refuses a marked slot that holds a different key (finding E-6). A slot that holds the old fixed mark certificate is refused with exit code 17 until it is emptied with scripts/yubikey-empty-slots.py. The sealed rows in this file come from the older probe, which recorded only that the module completed its own round trip. The code-hash is that of the tree after the merge of L5, and the re-probe that this record names is still owed."
reprobe = "the whole profile, by the regen command"

