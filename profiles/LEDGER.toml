# What was measured on hardware or a cloud, and what changed since (docs/CAPROBE.md, "The
# ledger"). nix/ledger.py holds this file to the tree on every build (checks.ledger).
#
# - `verified-by`: a build re-derives the file and compares it byte for byte. Nothing else is
#   recorded; every module profile under profiles/modules/ has an entry, of this kind or the next.
# - Otherwise the file came from a run no build repeats. [artifact.probed] is that run: the
#   commit that recorded it, its date, the file as the run wrote it (`hash`) and the code on its
#   path then (`code-hash`). `hash` is the file now, and any difference from the run's is a
#   [[artifact.hand-edits]] row. `code` lists the globs whose change can change the file, and the
#   lock entries (`Cargo.lock#<package>`, `flake.lock#<input>`) that pin what the run went
#   through; when their hash is no longer the run's, the check fails until
#   [artifact.acknowledged] names the new hash, who, why and what still needs a run on the
#   hardware. A comment or rustfmt edit of a Rust file changes no hash.
# - After a run on the hardware: [artifact.probed] and `hash` take the hashes the check prints,
#   and the hand edits and the acknowledgement go.
#
# Review 2026-11-24 E-7: every hardware and cloud profile is stale. The probe fixes of review
# 2026-11-23 (fce5432, fcaa6aa, 61b7000) came after their probes, and edited them by hand.
#
# p0-follow (2026-11-25) recomputed every `code-hash` once the hash read Rust as tokens and the
# lock entries joined `code`: the run's at its commit's tree, the acknowledged at the merge's.
# No reason changed, so no `why` did.

# Every regeneration is one command, `caprobe regenerate <profile>`, which holds the flags they
# share (review 2026-11-24 E-8): the write probes, the profile's name and diff, and RSA up to
# this size, which `verb` states (caprobe's own default runs to 16384, over a minute per size on
# a software token). Each source calls it and passes none of its flags, and no `regen` below
# names one.
[regen]
rsa-max-bits = 4096
verb = "crates/caprobe/src/lib.rs"
sources = [
  "scripts/regen-profiles.sh",
  "scripts/cloud/aws.sh",
  "scripts/cloud/gcp.sh",
  "crates/cli/tests/common/mod.rs",
]

[groups]
# What decides a probed row (docs/CAPROBE.md, "The probe"): the probe and its command; the token
# operations it drives as the verbs do, the provider seam it calls and which provider claims the
# module; the host-side checks that make a row yes (signatures, proofs, commitments, the moves'
# key handling); the keys it imports; the vocabulary it iterates (the names table's curves,
# hashes, commitments and device failures among it); the binding, as Cargo.lock
# pins it, and the patches on it (nix/package-common.nix), which decide what it can name. Not
# the emitter or the profile crate: every build holds the committed text to them (emit.rs,
# `every_committed_profile_is_what_the_emitter_writes`).
probe = [
  "crates/caprobe/src/lib.rs",
  "crates/caprobe/src/probe.rs",
  "crates/caprobe/src/probe/*.rs",
  "crates/pkcs11/src/token/*.rs",
  "crates/pkcs11/src/templates.rs",
  "crates/pkcs11/src/binding.rs",
  "crates/pkcs11/src/provider.rs",
  "crates/pkcs11/src/providers.rs",
  "crates/pkcs11/src/registry.rs",
  "crates/core/src/pop.rs",
  "crates/core/src/sig.rs",
  "crates/core/src/id.rs",
  "crates/core/src/plaintext.rs",
  "crates/core/src/migrate.rs",
  "crates/names/src/*.rs",
  "crates/caprobe/fixtures/import/*",
  "profiles/baselines/pkcs11-3.2.toml",
  "nix/patches/cryptoki-*.patch",
  "upstream/rust-cryptoki/0003-Add-RvError-to-CK_RV-and-its-name.patch",
  "Cargo.lock#cryptoki",
  "Cargo.lock#cryptoki-sys",
]
# What a lock records of a token, and how: the format, the observations, the rules of a run and
# the identity schemes, with the names they write (curves, bindings: the names table); the
# binding it reads the token through, as in `probe`.
lock = [
  "crates/core/src/config/lock.rs",
  "crates/core/src/config/observe.rs",
  "crates/core/src/reconcile.rs",
  "crates/core/src/id.rs",
  "crates/names/src/*.rs",
  "crates/pkcs11/src/token/*.rs",
  "nix/patches/cryptoki-*.patch",
  "upstream/rust-cryptoki/0003-Add-RvError-to-CK_RV-and-its-name.patch",
  "Cargo.lock#cryptoki",
  "Cargo.lock#cryptoki-sys",
]
# The modules nixpkgs builds for a device: ykcs11 (yubico-piv-tool), and tpm2-pkcs11 with
# tpm2-tss and tpm2-abrmd for the host's TPM, at the revision flake.lock pins. SoftHSM, kryoptic
# and tpm2-pkcs11 on swtpm come from it too, but every build re-probes them (`verified-by`); the
# cloud modules are the vendors' builds, pinned by version and hash in nix/kmsp11.nix and
# nix/cloudhsm.nix, which their entries watch whole.
nixpkgs = ["flake.lock#nixpkgs"]
# What decides an object matrix row (spec-coverage/objects/): the matrix, the tools' code from
# keys.toml to the lock, and the binding with its patches, as in `probe`; the modules, as in
# `nixpkgs`.
matrix = [
  "crates/cli/tests/object_matrix/mod.rs",
  "crates/cli/src/*.rs",
  "crates/cli-common/src/*.rs",
  "crates/core/src/**/*.rs",
  "crates/pkcs11/src/**/*.rs",
  "nix/patches/cryptoki-*.patch",
  "Cargo.lock#cryptoki",
  "Cargo.lock#cryptoki-sys",
  "flake.lock#nixpkgs",
]

