# What holds each universal claim of the documents that say what the tools guarantee (CAKEYS,
# CAMIGRATE, CAPROBE and DESIGN.md): checks.claims, nix/claims.py. A line that speaks for every
# case (every, never, always, the one way, …) about a security subject (a PIN, the lock, a slot,
# plaintext, …) is registered here, or counted against max-unregistered.
#
# max-unregistered only goes down: the check fails above the count and below it, so a claim
# registered or softened lowers it in the same diff, and nix/claims-test.py keeps it at or below
# its seed. A new claim is registered with its tests, or softened in its document.
#
# Each [[claim]] names its document (`doc`) and a phrase found there once (`says`), and is
# - kind = "enforced": `tests`, the fns that fail when the claim is false (each one must exist),
#   and optionally the entry `paths` they cover; or
# - kind = "descriptive": `why` it is no guarantee a test can hold.

max-unregistered = 99

# CAMIGRATE.md D5: a bundle's transport key is the target's own (review 2026-11-24 D-8).

[[claim]]
doc = "docs/CAMIGRATE.md"
says = "never under whichever key the bundle names"
kind = "enforced"
tests = ["bundles_are_bound_to_the_targets_transport_key", "a_bundle_binds_only_to_its_targets_transport_key"]
paths = ["import --in", "import --in --dry-run"]

# DESIGN.md §8.1, "Enforced (with tests)": the bullets whose tests exist.

[[claim]]
doc = "docs/DESIGN.md"
says = "Locators never create over occupied slots"
kind = "enforced"
tests = ["never_create_over_an_occupied_locator", "a_second_private_key_under_the_same_id_is_ambiguous"]

[[claim]]
doc = "docs/DESIGN.md"
says = "the binding is recorded and cannot weaken"
kind = "enforced"
tests = ["binding_downgrade_is_refused"]

[[claim]]
doc = "docs/DESIGN.md"
says = "Attestation commitments are verified evidence, never a standalone identity"
kind = "enforced"
tests = ["attestation_is_per_realisation_and_never_alone"]

[[claim]]
doc = "docs/DESIGN.md"
says = "Identity modes never weaken."
kind = "enforced"
tests = ["downgrade_is_an_error"]

[[claim]]
doc = "docs/DESIGN.md"
says = "Material is linked only through a shared scheme."
kind = "enforced"
tests = ["material_links_only_through_a_shared_scheme", "disjoint_schemes_never_link_material"]

[[claim]]
doc = "docs/DESIGN.md"
says = "Lock updates are serialized"
kind = "enforced"
tests = ["update_lock_waits_for_the_sidecar_lock"]

[[claim]]
doc = "docs/DESIGN.md"
says = "Refused operations leave nothing behind:"
kind = "enforced"
tests = [
  "a_creation_that_cannot_be_identified_is_undone_or_reported",
  "a_creation_that_fails_after_the_write_is_undone",
  "a_move_the_module_fails_is_refused_and_undone",
  "tpm2_identity_failure_after_create_leaves_nothing",
]

# Phase 1 P1 (review 2026-11-24 B-4, B-13, C-1, and the login lie): each claim it added is held
# by the tests that were run red before its fix.

[[claim]]
doc = "docs/DESIGN.md"
says = "A destroy is verified, never taken on the module's word"
kind = "enforced"
tests = ["a_delete_the_module_did_not_do_keeps_the_lock", "a_delete_the_module_does_not_do_keeps_the_lock"]

[[claim]]
doc = "docs/DESIGN.md"
says = "a dry run too (`delete-refused`, 15)"
kind = "enforced"
tests = [
  "a_profile_row_that_says_the_module_keeps_keys_refuses_the_delete",
  "tpm2_delete_is_refused_where_the_module_keeps_keys",
]

[[claim]]
doc = "docs/DESIGN.md"
says = "session left public hides every private object"
kind = "enforced"
tests = ["a_login_the_session_does_not_show_is_unavailable"]

[[claim]]
doc = "docs/CAKEYS.md"
says = "so it never reports one absent"
kind = "enforced"
tests = [
  "a_data_object_is_secret_unless_every_spec_says_public",
  "needs_login_asks_the_lock_then_the_spec_then_the_class",
]

[[claim]]
doc = "docs/CAKEYS.md"
says = "`every_pair_has_a_row_of_one_shape`)"
kind = "enforced"
tests = ["every_pair_has_a_row_of_one_shape", "a_failure_row_says_its_code_rule_and_device"]

# Review 2026-11-24 L5: a run that wrote the lock exits 22, whatever failed after the write
# (each run seen exiting the failure's code before its fix).

[[claim]]
doc = "docs/CAKEYS.md"
says = "never 0 and never a failure's code"
kind = "enforced"
tests = ["a_run_that_wrote_the_lock_exits_22_whatever_failed_after", "a_run_exits_22_exactly_when_it_wrote_the_lock"]
paths = ["lock", "create", "delete", "lock --dry-run", "create --dry-run", "delete --dry-run"]

[[claim]]
doc = "docs/CAKEYS.md"
says = "so a script never misses a written lock"
kind = "enforced"
tests = ["a_run_that_wrote_the_lock_exits_22_whatever_failed_after", "create_records_what_it_made_before_a_failure"]

[[claim]]
doc = "docs/CAMIGRATE.md"
says = "a written lock is never hidden"
kind = "enforced"
tests = ["a_failed_move_leaves_the_others_moving", "a_run_exits_22_exactly_when_it_wrote_the_lock"]
paths = ["migrate"]
