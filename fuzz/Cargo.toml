[package]
name = "cakeys-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "BSD-3-Clause"

[package.metadata]
cargo-fuzz = true

# Its own workspace (and lock): libfuzzer-sys never enters the product's dependency graph.
[workspace]

[dependencies]
# `fuzzing`: the entry points the targets call, built for them only.
cakeys-core = { path = "../crates/core", features = ["fuzzing"] }
camigrate = { path = "../crates/camigrate", default-features = false, features = ["fuzzing"] }
cakeys-tpm2-pkcs11 = { path = "../crates/tpm2-pkcs11", features = ["fuzzing"] }
cakeys-ykcs11 = { path = "../crates/ykcs11", features = ["fuzzing"] }
caprobe = { path = "../crates/caprobe", default-features = false, features = ["fuzzing"] }
libfuzzer-sys = "0.4.13"

[[bin]]
name = "public_key"
path = "fuzz_targets/public_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "certificate"
path = "fuzz_targets/certificate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cert_bundle"
path = "fuzz_targets/cert_bundle.rs"
