# cakeys against Google Cloud KMS (docs/CLOUD_HSM.md), run by `scripts/cloud/gcp.sh cakeys`: the
# module comes from --module gcp=<libkmsp11>, the PIN libkmsp11 ignores from the state directory.
# Every label is a key main.tf pre-creates with a 24-hour destroy duration and no version, and the
# algorithm the kmsp11 provider chooses for each spec must be that key's, or libkmsp11 refuses.

[tokens.gcp]
tokenLabel = "caprobe"
pinFile = "$CAKEYS_GCP_PIN"

[objects.ec-p256]
class = "CKO_PRIVATE_KEY"
keyType = "CKK_EC"
curve = "secp256r1"

[objects.ec-p384]
class = "CKO_PRIVATE_KEY"
keyType = "CKK_EC"
curve = "secp384r1"

[objects.rsa-sign]
class = "CKO_PRIVATE_KEY"
keyType = "CKK_RSA"
modulusBits = 2048

[objects.rsa-decrypt]
class = "CKO_PRIVATE_KEY"
keyType = "CKK_RSA"
modulusBits = 3072

# The same type for the refused spec below: a key is created by one pair only.
[objects.rsa-decrypt-pop]
class = "CKO_PRIVATE_KEY"
keyType = "CKK_RSA"
modulusBits = 3072

[objects.hmac]
class = "CKO_SECRET_KEY"
keyType = "CKK_SHA256_HMAC"
valueLen = 32

# Refused before anything is created: no Cloud KMS AES key can be committed to.
[objects.aes]
class = "CKO_SECRET_KEY"
keyType = "CKK_AES"
valueLen = 32

# EC_SIGN_P256_SHA256, proven by signing (pop-sign, the default).
[specs.ec-p256]
object = "ec-p256"
attributes = { CKA_SIGN = true, CKA_SENSITIVE = true, CKA_EXTRACTABLE = false }
publicAttributes = { CKA_VERIFY = true }
tokens.gcp = { locator = { CKA_LABEL = "cakeys-ec-p256" }, origin = "create" }

# The same label once more, for new material: a deleted key's label takes a new version (the key
# was pre-created; a key libkmsp11 made itself would refuse it). A new object name, since the
# lock keeps the first one's identity.
[objects.ec-p256-again]
class = "CKO_PRIVATE_KEY"
keyType = "CKK_EC"
curve = "secp256r1"

[specs.ec-p256-again]
object = "ec-p256-again"
attributes = { CKA_SIGN = true }
tokens.gcp = { locator = { CKA_LABEL = "cakeys-ec-p256" }, origin = "create" }

# EC_SIGN_P384_SHA384.
[specs.ec-p384]
object = "ec-p384"
attributes = { CKA_SIGN = true }
tokens.gcp = { locator = { CKA_LABEL = "cakeys-ec-p384" }, origin = "create" }

# RSA_SIGN_PKCS1_2048_SHA256, the default for signing, which pop-sign's CKM_SHA256_RSA_PKCS fits.
[specs.rsa-sign]
object = "rsa-sign"
attributes = { CKA_SIGN = true, CKA_DECRYPT = false }
tokens.gcp = { locator = { CKA_LABEL = "cakeys-rsa-sign-2048" }, origin = "create" }

# RSA_DECRYPT_OAEP_3072_SHA256: decrypt-only. Still token-asserted here: pop-decrypt now proves
# with the key's own OAEP hash and the provider no longer refuses it, but that has not been run
# against Cloud KMS yet (ISSUES.md B11). Switch this pair to binding = "pop-decrypt" to test it.
[specs.rsa-decrypt]
object = "rsa-decrypt"
attributes = { CKA_DECRYPT = true }
tokens.gcp = { locator = { CKA_LABEL = "cakeys-rsa-decrypt-3072" }, origin = "create", binding = "token-asserted" }

# HMAC_SHA256: committed to by HMAC over the commitment label.
[specs.hmac]
object = "hmac"
attributes = { CKA_SIGN = true }
tokens.gcp = { locator = { CKA_LABEL = "cakeys-hmac-sha256" }, origin = "create" }

# Refused before creating: Cloud KMS keys never unwrap, so pop-unwrap cannot prove one.
[specs.rsa-pop-unwrap]
object = "rsa-decrypt-pop"
attributes = { CKA_DECRYPT = true, CKA_UNWRAP = true }
tokens.gcp = { locator = { CKA_LABEL = "cakeys-never-created-1" }, origin = "create", binding = "pop-unwrap" }

# Refused before creating: AES.
[specs.aes]
object = "aes"
attributes = { CKA_ENCRYPT = true }
tokens.gcp = { locator = { CKA_LABEL = "cakeys-never-created-2" }, origin = "create" }
