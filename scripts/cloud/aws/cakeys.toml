# cakeys against AWS CloudHSM (docs/CLOUD_HSM.md), run on the runner by `scripts/cloud/aws.sh
# cakeys`: the module comes from --module cloudhsm=<libcloudhsm_pkcs11.so>, the crypto user's PIN
# (user:password) from a tmpfs file. Each object exercises one path the profiles describe.

[tokens.cloudhsm]
tokenLabel = "hsm1"
pinFile = "$CAKEYS_AWS_PIN"
# Sealed moves into CloudHSM wrap to this key (docs/CAMIGRATE.md D3).
transportWith = "transport"

# A SoftHSM token on the runner, the other side of camigrate's moves.
[tokens.softhsm]
tokenLabel = "kmtest"
pinFile = "/root/softhsm/pin"
# Sealed moves out of CloudHSM wrap to this key.
transportWith = "softhsm-transport"

[objects.ec-p256]
class = "CKO_PRIVATE_KEY"
keyType = "CKK_EC"
curve = "secp256r1"

[objects.ec-p384-derive]
class = "CKO_PRIVATE_KEY"
keyType = "CKK_EC"
curve = "secp384r1"

[objects.rsa-sign]
class = "CKO_PRIVATE_KEY"
keyType = "CKK_RSA"
modulusBits = 2048

[objects.rsa-decrypt]
class = "CKO_PRIVATE_KEY"
keyType = "CKK_RSA"
modulusBits = 3072

[objects.aes]
class = "CKO_SECRET_KEY"
keyType = "CKK_AES"
valueLen = 32

[objects.hmac]
class = "CKO_SECRET_KEY"
keyType = "CKK_GENERIC_SECRET"
valueLen = 32

# CloudHSM's transport key: RSA, unwrap-only, never extractable.
[objects.transport]
class = "CKO_PRIVATE_KEY"
keyType = "CKK_RSA"
modulusBits = 3072

# Born on SoftHSM, extractable, moved into CloudHSM by camigrate.
[objects.movable]
class = "CKO_PRIVATE_KEY"
keyType = "CKK_EC"
curve = "secp256r1"
createOn = "softhsm"

# Ed25519: a non-FIPS cluster makes it with CKM_EC_KEY_PAIR_GEN and signs with its vendor EdDSA
# (the aws-cloudhsm provider's stand-ins, the profile's `add` row); a FIPS one refuses it, and
# cakeys refuses it there before creating anything.
[objects.ed25519]
class = "CKO_PRIVATE_KEY"
keyType = "CKK_EC_EDWARDS"
curve = "edwards25519"

# SoftHSM's transport key, for moves out of CloudHSM.
[objects.softhsm-transport]
class = "CKO_PRIVATE_KEY"
keyType = "CKK_RSA"
modulusBits = 3072

# Born on CloudHSM, extractable, moved out to SoftHSM: CloudHSM wraps it by
# CKM_RSA_AES_KEY_WRAP (its profile subtracts the AES key wraps it lists but refuses).
[objects.outbound]
class = "CKO_PRIVATE_KEY"
keyType = "CKK_EC"
curve = "secp256r1"
createOn = "cloudhsm"

# pop-sign over ECDSA; the public half is generated without CKA_PRIVATE = false (refused).
[specs.ec-p256]
object = "ec-p256"
attributes = { CKA_SIGN = true, CKA_SENSITIVE = true, CKA_EXTRACTABLE = false }
tokens.cloudhsm = { locator = { CKA_LABEL = "cakeys-ec-p256" } }

# pop-ecdh: raw ECDH (the client's ecdh_without_kdf, set by activate), derived without the
# template's CKA_EXTRACTABLE = false.
[specs.ec-p384-derive]
object = "ec-p384-derive"
attributes = { CKA_DERIVE = true, CKA_SIGN = false }
tokens.cloudhsm = { locator = { CKA_LABEL = "cakeys-ec-p384-derive" }, binding = "pop-ecdh" }

# pop-sign over CKM_SHA256_RSA_PKCS.
[specs.rsa-sign]
object = "rsa-sign"
attributes = { CKA_SIGN = true }
tokens.cloudhsm = { locator = { CKA_LABEL = "cakeys-rsa-sign" } }

# pop-decrypt over RSA-OAEP with SHA-1.
[specs.rsa-decrypt]
object = "rsa-decrypt"
attributes = { CKA_DECRYPT = true, CKA_SIGN = false }
tokens.cloudhsm = { locator = { CKA_LABEL = "cakeys-rsa-decrypt" }, binding = "pop-decrypt" }

# AES committed to by CMAC.
[specs.aes]
object = "aes"
attributes = { CKA_SIGN = true }
tokens.cloudhsm = { locator = { CKA_LABEL = "cakeys-aes" } }

# A generic secret committed to by HMAC-SHA256.
[specs.hmac]
object = "hmac"
attributes = { CKA_SIGN = true }
tokens.cloudhsm = { locator = { CKA_LABEL = "cakeys-hmac" } }

# pop-unwrap: RSA-OAEP (SHA-1) unwrap of a host secret, then HMAC with it.
[specs.transport]
object = "transport"
attributes = { CKA_UNWRAP = true, CKA_EXTRACTABLE = false, CKA_SIGN = false, CKA_DECRYPT = false }
tokens.cloudhsm = { locator = { CKA_LABEL = "cakeys-transport" }, binding = "pop-unwrap" }

# The same EC key on both tokens: created on SoftHSM, then `camigrate migrate movable --from
# softhsm --to cloudhsm`; the identity must be the same on both.
[specs.movable]
object = "movable"
attributes = { CKA_SIGN = true, CKA_EXTRACTABLE = true }
tokens.softhsm = { locator = { CKA_LABEL = "cakeys-movable" } }
tokens.cloudhsm = { locator = { CKA_LABEL = "cakeys-movable" } }

# pop-sign over pure EdDSA; it moves out to SoftHSM, never in (the profile's migration.refuses).
[specs.ed25519]
object = "ed25519"
attributes = { CKA_SIGN = true, CKA_EXTRACTABLE = true }
tokens.cloudhsm = { locator = { CKA_LABEL = "cakeys-ed25519" } }
tokens.softhsm = { locator = { CKA_LABEL = "cakeys-ed25519" } }

[specs.softhsm-transport]
object = "softhsm-transport"
attributes = { CKA_UNWRAP = true, CKA_EXTRACTABLE = false, CKA_SIGN = false, CKA_DECRYPT = false }
tokens.softhsm = { locator = { CKA_LABEL = "cakeys-transport" }, binding = "pop-unwrap" }

# The reverse: created on CloudHSM, then `camigrate migrate outbound --from cloudhsm --to
# softhsm`; again one identity on both.
[specs.outbound]
object = "outbound"
attributes = { CKA_SIGN = true, CKA_EXTRACTABLE = true }
tokens.cloudhsm = { locator = { CKA_LABEL = "cakeys-outbound" } }
tokens.softhsm = { locator = { CKA_LABEL = "cakeys-outbound" } }
