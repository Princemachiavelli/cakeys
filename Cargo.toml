[workspace]
resolver = "2"
members = ["crates/core", "crates/pkcs11", "crates/softhsm", "crates/ykcs11", "crates/tpm2-pkcs11", "crates/p11-kit", "crates/cli"]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cakeys-core = { path = "crates/core" }
cakeys-pkcs11 = { path = "crates/pkcs11" }
cakeys-softhsm = { path = "crates/softhsm" }
cakeys-ykcs11 = { path = "crates/ykcs11" }
cakeys-tpm2-pkcs11 = { path = "crates/tpm2-pkcs11" }
cakeys-p11-kit = { path = "crates/p11-kit" }
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
cryptoki = "0.12"
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
p256 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "ecdsa"] }
p384 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "ecdsa"] }
p521 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "ecdsa"] }
k256 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "arithmetic", "ecdsa"] }
bp256 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "arithmetic", "ecdsa"] }
bp384 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "arithmetic", "ecdsa"] }
elliptic-curve = { version = "0.14", default-features = false, features = ["ecdh", "sec1"] }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "pkcs8"] }
ed448 = { version = "0.5", default-features = false, features = ["alloc", "pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", features = ["oid"] }
thiserror = "2"
toml = "1"
getrandom = { version = "0.4", features = ["sys_rng"] }
ecdsa = { version = "0.17", default-features = false, features = ["std", "algorithm"] }
aes = "0.9"
aes-kw = "0.3"
cmac = "0.8"
hmac = "0.13"
sha1 = "0.11"
tss-esapi = "7.7"
rusqlite = { version = "0.42", features = ["bundled"] }
aes-gcm = "0.11"
zeroize = "1"
libc = "0.2"
