[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/profile",
  "crates/pkcs11",
  "crates/ykcs11",
  "crates/tpm2-pkcs11",
  "crates/cli-common",
  "crates/cli",
  "crates/caprobe",
  "crates/camigrate",
]
default-members = ["crates/cli", "crates/caprobe", "crates/camigrate"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cakeys-core = { path = "crates/core" }
cakeys-pkcs11 = { path = "crates/pkcs11" }
cakeys-profile = { path = "crates/profile" }
cakeys-ykcs11 = { path = "crates/ykcs11" }
cakeys-tpm2-pkcs11 = { path = "crates/tpm2-pkcs11" }
cakeys-cli-common = { path = "crates/cli-common" }
anyhow = "1"
base16ct = { version = "1", features = ["alloc"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
cryptoki = "0.12"
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
x509-cert = { version = "0.3", default-features = false, features = ["std", "pem"] }
p256 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "ecdsa"] }
p384 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "ecdsa"] }
p521 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "ecdsa"] }
k256 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "arithmetic", "ecdsa"] }
bp256 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "arithmetic", "ecdsa"] }
bp384 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "arithmetic", "ecdsa"] }
elliptic-curve = { version = "0.14", default-features = false, features = ["ecdh", "sec1"] }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "pkcs8"] }
ed448 = { version = "0.5", default-features = false, features = ["alloc", "pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
sha2 = { version = "0.11", features = ["oid"] }
subtle = { version = "2", default-features = false }
proptest = { version = "1.12", default-features = false, features = ["std"] }
thiserror = "2"
toml = "1"
getrandom = { version = "0.4", features = ["sys_rng"] }
ecdsa = { version = "0.17", default-features = false, features = ["std", "algorithm"] }
aes = "0.9"
aes-kw = "0.3"
cmac = "0.8"
hmac = "0.13"
sha1 = "0.11"
serde_norway = "0.9"
tss-esapi = "7.7"
rusqlite = { version = "0.42", features = ["bundled"] }
aes-gcm = "0.11"
# Passphrase-protected key files (camigrate, docs/CAMIGRATE.md phase 4b): PKCS#8 EncryptedPrivateKeyInfo
# under PBES2, and PKCS#12. pkcs12 0.2 and its cms are release candidates of the same RustCrypto
# line as der 0.8 / x509-cert 0.3 (no second copy of anything).
pkcs8 = { version = "0.11", features = ["encryption", "pem"] }
pkcs12 = { version = "0.2.0-rc.0", default-features = false, features = ["kdf"] }
der = { version = "0.8", features = ["alloc", "pem", "oid"] }
zeroize = "1"
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
tempfile = "3"

# Inherited by every member with `[lints] workspace = true`. `cargo clippy` (checks.clippy)
# runs with `-D warnings`, so everything here is clean at the stated level.
[workspace.lints.rust]
# The one exemption is `#[expect]`ed and carries `// SAFETY:` comments: the loader lookup of the
# module file the lock records (crates/pkcs11/src/token/mod.rs).
unsafe_code = "deny"

[workspace.lints.clippy]
# Pedantic in full: no blanket allows. Where a lint does not fit, the exemption is a per-site
# #[expect(lint, reason = "...")] (or, for must_use_candidate, the #[must_use] the lint
# suggests), so a new occurrence anywhere warns and an exemption that no longer fires does too.
# #[allow(..., reason)] only where #[expect] cannot be fulfilled (on a `use` item) or would not
# be in every test binary.
pedantic = { level = "warn", priority = -1 }
