[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/names",
  "crates/profile",
  "crates/pkcs11",
  "crates/ykcs11",
  "crates/tpm2-pkcs11",
  "crates/kmsp11",
  "crates/aws-cloudhsm",
  "crates/cli-common",
  "crates/cli",
  "crates/caprobe",
  "crates/camigrate",
  "crates/p11-fault",
  "crates/p11-names",
]
default-members = ["crates/cli", "crates/caprobe", "crates/camigrate", "crates/p11-fault"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "BSD-3-Clause"
repository = "https://github.com/Princemachiavelli/cakeys"
# Nothing here goes to crates.io: the tools ship through the flake (README.md, "Nix").
publish = false

[workspace.dependencies]
# The `version` on each path is what crates.io would need of it; it moves with
# workspace.package.version.
cakeys-core = { path = "crates/core", version = "0.1.0" }
cakeys-pkcs11 = { path = "crates/pkcs11", version = "0.1.0" }
cakeys-profile = { path = "crates/profile", version = "0.1.0" }
cakeys-names = { path = "crates/names", version = "0.1.0" }
cakeys-ykcs11 = { path = "crates/ykcs11", version = "0.1.0" }
cakeys-tpm2-pkcs11 = { path = "crates/tpm2-pkcs11", version = "0.1.0" }
cakeys-kmsp11 = { path = "crates/kmsp11", version = "0.1.0" }
cakeys-aws-cloudhsm = { path = "crates/aws-cloudhsm", version = "0.1.0" }
# Without its providers: each tool turns them on through its own `tpm2` and `ykcs11` features.
cakeys-cli-common = { path = "crates/cli-common", version = "0.1.0", default-features = false }
p11-names = { path = "crates/p11-names", version = "0.1.0" }
anyhow = "1"
base16ct = { version = "1", features = ["alloc"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
# Tab completion from the binaries themselves (`COMPLETE=bash cakeys`): the verbs, flags and value
# enums come from the clap definition, so there is no list to keep in step. The dynamic engine is
# the one the derive API supports; upstream still marks the feature unstable, so Cargo.lock holds it.
clap_complete = { version = "4", features = ["unstable-dynamic"] }
# parallaxsecond/rust-cryptoki's main, not a release: the vendor mechanisms in
# C_GetMechanismList (6cc2278) and the single-part Session::sign_single (d1b283e) are unreleased
# (0.12.1 lacks both), and the Nix build patches the rest (nix/patches, upstream/rust-cryptoki/).
# One rev for both crates: cryptoki-sys must be the one cryptoki uses. When a release has what
# main has, go back to the version.
cryptoki = { git = "https://github.com/parallaxsecond/rust-cryptoki", rev = "2e4ff5d717f46f90785496949c08599b589b8e32" }
# The C types and loader p11-fault forwards with (docs/FAULT_SHIM.md): the versions cryptoki uses.
# cakeys-aws-cloudhsm reads a mechanism's raw parameter with it too.
cryptoki-sys = { git = "https://github.com/parallaxsecond/rust-cryptoki", rev = "2e4ff5d717f46f90785496949c08599b589b8e32" }
libloading = "0.8"
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
x509-cert = { version = "0.3", default-features = false, features = ["std", "pem"] }
p256 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "ecdsa"] }
p384 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "ecdsa"] }
p521 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "ecdsa"] }
k256 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "arithmetic", "ecdsa"] }
bp256 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "arithmetic", "ecdsa"] }
bp384 = { version = "0.14", default-features = false, features = ["std", "pkcs8", "arithmetic", "ecdsa"] }
elliptic-curve = { version = "0.14", default-features = false, features = ["ecdh", "sec1"] }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "pkcs8"] }
ed448 = { version = "0.5", default-features = false, features = ["alloc", "pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
sha2 = { version = "0.11", features = ["oid"] }
subtle = { version = "2", default-features = false }
proptest = { version = "1.12", default-features = false, features = ["std"] }
# Model-based tests (crates/core/tests/lock_mbt.rs): it runs `quint` from PATH, and its `--mbt`
# trace output is still marked experimental in Quint, hence the exact pin.
quint-connect = "=0.1.2"
thiserror = "2"
toml = "1"
getrandom = { version = "0.4", features = ["sys_rng"] }
ecdsa = { version = "0.17", default-features = false, features = ["std", "algorithm"] }
aes = "0.9"
aes-kw = "0.3"
cmac = "0.8"
# The host oracle of the DES3 check values (crates/cli/tests): Triple DES on the cipher 0.5 line.
des = "0.9"
hmac = { version = "0.13", features = ["zeroize"] }
sha1 = "0.11"
serde_norway = "0.9"
tss-esapi = "7.7"
rusqlite = { version = "0.42", features = ["bundled"] }
aes-gcm = "0.11"
# Passphrase-protected key files (camigrate, docs/CAMIGRATE.md phase 4b): PKCS#8 EncryptedPrivateKeyInfo
# under PBES2, and PKCS#12. pkcs12 0.2 and its cms are release candidates of the same RustCrypto
# line as der 0.8 / x509-cert 0.3 (no second copy of anything). A release candidate promises no
# compatibility with the next, so it is pinned exactly: moving to another is a deliberate edit.
pkcs8 = { version = "0.11", features = ["encryption", "pem"] }
pkcs12 = { version = "=0.2.0-rc.0", default-features = false, features = ["kdf"] }
der = { version = "0.8", features = ["alloc", "pem", "oid"] }
zeroize = "1"
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
tempfile = "3"

# Inherited by every member with `[lints] workspace = true`. `cargo clippy` (checks.clippy)
# runs with `-D warnings`, so everything here is clean at the stated level.
[workspace.lints.rust]
# The two exemptions are `#[expect]`ed and carry `// SAFETY:` comments: the loader lookup of the
# module file the lock records (crates/pkcs11/src/token/library.rs), and p11-fault, a PKCS#11 module
# whose C ABI is the whole crate.
unsafe_code = "deny"
# Private is the default: an item is `pub` only when another crate uses it (a sibling, a crate's
# tests/ or examples/, or a provider outside the workspace through crates/pkcs11/src/provider.rs),
# and then it says what it is.
missing_docs = "warn"
unreachable_pub = "warn"
# `kani`: set when Kani compiles the proofs in cakeys_core::fuzzing (docs/OPEN.md).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
# Pedantic in full: no blanket allows. Where a lint does not fit, the exemption is a per-site
# #[expect(lint, reason = "...")] (or, for must_use_candidate, the #[must_use] the lint
# suggests), so a new occurrence anywhere warns and an exemption that no longer fires does too.
# #[allow(..., reason)] only where #[expect] cannot be fulfilled (on a `use` item) or would not
# be in every test binary.
pedantic = { level = "warn", priority = -1 }

# Debug builds (scripts/local-tests.sh). Every cakeys run hashes the module it loads
# (provenance), and in a traced run (nix/test-tokens.sh) that module is p11-fault: unoptimised
# SHA-256 over an 11 MB debug p11-fault tripled the run. Release builds (the check phase) are
# unaffected.
[profile.dev.package.sha2]
opt-level = 3

# The PKCS#12 MAC key takes as many KDF iterations as the key's encryption (600,000,
# crates/camigrate/src/file.rs): unoptimised, each key file a test writes or reads took seconds.
[profile.dev.package.pkcs12]
opt-level = 3

[profile.dev.package.p11-fault]
opt-level = 2
debug = false
strip = "symbols"
