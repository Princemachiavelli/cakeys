[package]
name = "key-mgmnt"
version = "0.1.0"
edition = "2021"
description = "Content-addressed identity for PKCS#11 (and later TPM) objects"
license = "MIT OR Apache-2.0"

[[bin]]
name = "key-mgmnt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
cryptoki = "0.10"
p256 = { version = "0.13", default-features = false, features = ["std", "pkcs8", "ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
hmac = "0.12"
