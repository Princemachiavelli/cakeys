reason = "a key's wrap, unwrap and derive templates: the policy the lock pins is the boolean usage and sensitivity attributes (LOCK.md)"

[[rule]]
table = "attributes"
match = "CKA_UNIQUE_ID"
status = "out-of-scope"
reason = "a token-assigned ID: identity is the material's hash, which holds across tokens; objects are located by CKA_LABEL and CKA_ID"

[[rule]]
