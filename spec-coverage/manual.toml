status = "out-of-scope"
reason = "a Java MIDP certificate setting: not part of a certificate's identity"

[[rule]]
table = "attributes"
match = "CKA_URL"
status = "out-of-scope"
reason = "where a certificate may be fetched: cakeys reads the certificate's value"

[[rule]]
table = "attributes"
match = "CKA_APPLICATION"
status = "out-of-scope"
reason = "a data object's application: data objects are located by CKA_LABEL and identified by their value's hash"

[[rule]]
table = "attributes"
match = "CKA_OBJECT_ID"
status = "out-of-scope"
reason = "a data object's type OID: data objects are located by CKA_LABEL and identified by their value's hash"

[[rule]]
table = "attributes"
match = "CKA_SECONDARY_AUTH"
status = "out-of-scope"
reason = "deprecated since 2.20"

[[rule]]
table = "attributes"
match = "CKA_AUTH_PIN_FLAGS"
status = "out-of-scope"
reason = "deprecated since 2.20"

# ---- return values ---------------------------------------------------------------------------
# A return value no test meets: those cakeys matches by name are gaps in the tests; any other
# fails the call, which cakeys reports with the function and the value's name (exit 16,
# unavailable, unless its verb maps it otherwise).

[[rule]]
table = "return-values"
match = "CKR_TEMPLATE_IN*"
status = "gap"
reason = "matched by name (crates/pkcs11/src/token/possession.rs, generate.rs; caprobe's probe), met by no test"

[[rule]]
table = "return-values"
match = "CKR_WRAPPED_KEY_*"
status = "gap"
reason = "matched by name (crates/pkcs11/src/token/possession.rs), met by no test"

[[rule]]
table = "return-values"
match = "CKR_OBJECT_HANDLE_INVALID"
status = "gap"
reason = "matched by name (crates/pkcs11/src/token/generate.rs), met by no test"

[[rule]]
table = "return-values"
match = "CKR_KEY_FUNCTION_NOT_PERMITTED"
status = "gap"
reason = "matched by name (crates/pkcs11/src/token/possession.rs), met by no test"

[[rule]]
table = "return-values"
match = "CKR_ENCRYPTED_DATA_LEN_RANGE"
status = "gap"
reason = "matched by name (crates/pkcs11/src/token/possession.rs), met by no test"

[[rule]]
table = "return-values"
match = "CKR_OPERATION_ACTIVE"
status = "gap"
reason = "matched by name (caprobe's probe: an operation the module left active decides nothing), met by no test"

[[rule]]
table = "return-values"
match = "CKR_MECHANISM_PARAM_INVALID"
status = "gap"
reason = "matched by name (crates/pkcs11/src/token/possession.rs, crates/camigrate/src/sealed.rs; caprobe's secret probes), met by no test"

[[rule]]
table = "return-values"
match = "CKR_ENCRYPTED_DATA_INVALID"
status = "gap"
reason = "matched by name (crates/pkcs11/src/token/possession.rs, crates/camigrate/src/sealed.rs), met by no test"

[[rule]]
table = "return-values"
match = "CKR_*"
status = "out-of-scope"
reason = "met by no test and matched by no name: the call fails, and cakeys reports the function and the value's name (16, unavailable, unless the verb maps it)"

# ---- key types -------------------------------------------------------------------------------

[[rule]]
table = "key-types"
match = "CKK_ML_*"
status = "gap"
reason = "OPEN.md, \"Post-quantum key types\""

[[rule]]
table = "key-types"
match = "CKK_SLH_DSA"
status = "gap"
reason = "OPEN.md, \"Post-quantum key types\""

[[rule]]
table = "key-types"
match = "CKK_DES2"
status = "gap"
reason = "two-key Triple DES, common in payment HSMs (OPEN.md)"

[[rule]]
table = "key-types"
match = "CKK_HSS"
status = "out-of-scope"
reason = "stateful hash-based signature keys: a key that counts its uses cannot sign a challenge per check"

[[rule]]
table = "key-types"
match = "CKK_XMSS*"
status = "out-of-scope"
reason = "stateful hash-based signature keys: a key that counts its uses cannot sign a challenge per check"

[[rule]]
table = "key-types"
match = "CKK_X2RATCHET"
status = "out-of-scope"
reason = "the Signal protocol's Double Ratchet state: no key material to identify"

[[rule]]
table = "key-types"
match = "CKK_*_HMAC"
status = "out-of-scope"
reason = "HMAC keys of other hashes: cakeys commits to SHA-1 and SHA-2 HMAC keys (types.rs)"

[[rule]]
table = "key-types"
match = "CKK_AES_XTS"
status = "out-of-scope"
reason = "AES-XTS double-length keys (3.0): disk encryption keys with no commitment cakeys uses"

[[rule]]
table = "key-types"
match = "CKK_*"
status = "out-of-scope"
reason = "no key type in cakeys (types.rs): a legacy, national or protocol-bound algorithm"

# ---- objects, certificates ---------------------------------------------------------------------

[[rule]]
table = "objects"
match = "CKO_OTP_KEY"
status = "out-of-scope"
reason = "one-time-password keys: not objects cakeys identifies"

[[rule]]
table = "objects"
match = "CKO_TRUST"
status = "out-of-scope"
reason = "trust objects (3.2): a certificate is pinned by its hash; cakeys reads no trust settings"

[[rule]]
table = "objects"
match = "CKO_MECHANISM"
status = "out-of-scope"
reason = "mechanism objects: caprobe measures mechanisms by using them (CAPROBE.md)"

[[rule]]
table = "objects"
match = "CKO_*"
status = "out-of-scope"
reason = "hardware features and domain parameters: no material to identify"

[[rule]]
table = "certificate-types"
match = "CKC_*"
status = "out-of-scope"
reason = "attribute and WTLS certificates: cakeys pins X.509 public-key certificates"

[[rule]]
table = "trust-values"
match = "CKT_*"
status = "out-of-scope"
reason = "trust objects (3.2): cakeys reads no trust settings"

[[rule]]
table = "validation-types"
match = "CKV_*"
status = "out-of-scope"
reason = "validation objects (3.2): provenance comes from the module and token info (LOCK.md)"

[[rule]]
table = "hardware-features"
match = "CKH_*"
status = "out-of-scope"
reason = "hardware feature objects: no material to identify"

# ---- parameters and enumerations ---------------------------------------------------------------

[[rule]]
table = "parameter-sets"
match = "CKP_ML_*"
status = "gap"
reason = "OPEN.md, \"Post-quantum key types\""

[[rule]]
table = "parameter-sets"
match = "CKP_SLH_*"
status = "gap"
reason = "OPEN.md, \"Post-quantum key types\""

[[rule]]
table = "parameter-sets"
match = "CKP_PKCS5_PBKD2_*"
status = "out-of-scope"
reason = "password-based key derivation on the token: camigrate's key files do PBES2 on the host"

[[rule]]
table = "conformance-profiles"
match = "CKP_*"
status = "out-of-scope"
reason = "a module's claimed conformance profiles: caprobe measures what it does (CAPROBE.md)"

[[rule]]
table = "kdfs"
match = "CKD_*"
status = "out-of-scope"
reason = "an EC key's proof derives the raw shared secret (CKD_NULL) and hashes it on the host"

[[rule]]
table = "generators"
match = "CKG_MGF1_*"
status = "out-of-scope"
reason = "OAEP and PSS use MGF1 with the SHA-1 or SHA-2 hash of the mechanism; other hashes are not offered"

[[rule]]
table = "generators"
match = "CKG_*"
status = "out-of-scope"
reason = "IV generators of message-based AEAD (3.0): cakeys' commitments use no IV"

[[rule]]
table = "sources"
match = "CKZ_SALT_SPECIFIED"
status = "out-of-scope"
reason = "the PBKDF2 salt source: password-based derivation on the token is not used"

[[rule]]
table = "sources"
match = "CKZ_*"
status = "out-of-scope"
reason = "an OAEP encoding parameter source: cakeys' OAEP uses an empty label"

[[rule]]
table = "session-states"
match = "CKS_*"
status = "out-of-scope"
reason = "cakeys logs in and out explicitly and reads no session state"

[[rule]]
table = "notifications"
match = "CKN_*"
status = "out-of-scope"
reason = "notification callbacks: cakeys opens sessions without one"

# ---- flags -----------------------------------------------------------------------------------
# A flag is used when a tool passed it or read it back set (C_Initialize, C_OpenSession, slot,
# token and mechanism info). The rest:

[[rule]]
table = "flags"
match = "CKF_WRITE_PROTECTED"
status = "gap"
reason = "acted on (crates/pkcs11/src/token/), set on no token of the tests"

[[rule]]
table = "flags"
match = "CKF_SO_PIN_*"
status = "gap"
reason = "acted on (crates/pkcs11/src/token/, the SO PIN's counters), set on no token of the tests"

[[rule]]
table = "flags"
match = "CKF_PROTECTED_AUTHENTICATION_PATH"
status = "out-of-scope"
reason = "a PIN pad: cakeys always logs in with the PIN it is given (pinFile)"

[[rule]]
table = "flags"
match = "CKF_USER_PIN_TO_BE_CHANGED"
status = "out-of-scope"
reason = "PIN changes are the operator's (C_SetPIN is not used)"

[[rule]]
table = "flags"
match = "CKF_*"
status = "out-of-scope"
reason = "passed by no tool and read back set by none: the slot flags (C_GetSlotInfo is not used), the mechanism-info flags (a module is asked only for RSA generation's key sizes; caprobe measures mechanisms by using them), and the flags of interfaces, OTP, HKDF, message-based and asynchronous operations"

# ---- functions, added after the fault suites left the trace ------------------------------------

[[rule]]
table = "functions"
match = "C_GetSessionInfo"
status = "out-of-scope"
reason = "cakeys logs in and out explicitly and reads no session state"
