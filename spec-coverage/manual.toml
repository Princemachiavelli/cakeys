# Hand-kept statuses for the coverage file (crates/caprobe/src/coverage.rs): rows no traced
# call reaches, by table and name pattern (`*` for any run of characters). The first rule that
# matches decides; a rule that matches nothing, or names a used row exactly, fails the test.
#
#   status: out-of-scope (a written reason), gap (should be handled and is not: the OPEN.md
#   item).

# ---- functions -------------------------------------------------------------------------------

[[rule]]
table = "functions"
match = "C_GetInterface*"
status = "gap"
reason = "cryptoki asks every module for C_GetInterface first and uses its 3.x table; the traced run cannot see it, p11-fault exporting the 2.40 entry point only (FAULT_SHIM.md, the 3.x interface)"

[[rule]]
table = "functions"
match = "C_*capsulateKey"
status = "gap"
reason = "ML-KEM keys (OPEN.md, \"Post-quantum key types\")"

[[rule]]
table = "functions"
match = "C_Init*"
status = "out-of-scope"
reason = "token administration (C_InitToken, C_InitPIN): the operator's tools initialise tokens; cakeys only logs in"

[[rule]]
table = "functions"
match = "C_SetPIN"
status = "out-of-scope"
reason = "token administration: cakeys never changes a PIN"

[[rule]]
table = "functions"
match = "C_LoginUser"
status = "out-of-scope"
reason = "PKCS#11 3.0 named-user login; cakeys logs in as CKU_USER, CKU_SO or CKU_CONTEXT_SPECIFIC"

[[rule]]
table = "functions"
match = "C_Verify*"
status = "out-of-scope"
reason = "signatures are verified on the host, never by the token whose key is being proven (DESIGN.md)"

[[rule]]
table = "functions"
match = "C_Digest*"
status = "out-of-scope"
reason = "hashes are computed on the host; C_DigestKey's unkeyed hash of a secret key is not one of cakeys' commitments (CMAC, ECB check values, key wrap, HMAC)"

[[rule]]
table = "functions"
match = "C_*Message*"
status = "out-of-scope"
reason = "PKCS#11 3.0 message-based operations: cakeys' proofs and commitments are single-part"

[[rule]]
table = "functions"
match = "C_*Update"
status = "out-of-scope"
reason = "multi-part and dual-function operations: cakeys' proofs and commitments are single-part (C_SignFinal only after C_SignInit, for a per-use PIN)"

[[rule]]
table = "functions"
match = "C_*Final"
status = "out-of-scope"
reason = "multi-part operations: cakeys' proofs and commitments are single-part"

[[rule]]
table = "functions"
match = "C_*Recover*"
status = "out-of-scope"
reason = "signatures with message recovery: cakeys' proofs sign a fresh challenge"

[[rule]]
table = "functions"
match = "C_Async*"
status = "out-of-scope"
reason = "PKCS#11 3.2 asynchronous operations: cakeys waits for each call"

[[rule]]
table = "functions"
match = "C_*KeyAuthenticated"
status = "out-of-scope"
reason = "PKCS#11 3.2 authenticated key wrap: camigrate's transports are RFC 5649 and RSA-OAEP (CAMIGRATE.md)"

[[rule]]
table = "functions"
match = "C_*Random"
status = "out-of-scope"
reason = "challenges come from the host's RNG, never from the token they test"

[[rule]]
table = "functions"
match = "C_*OperationState"
status = "out-of-scope"
reason = "no operation outlives the call that started it"

[[rule]]
table = "functions"
match = "C_*Function*"
status = "out-of-scope"
reason = "the 2.x parallel-function stubs (C_GetFunctionStatus, C_CancelFunction); C_GetFunctionList is how every module is loaded and counts as used"

[[rule]]
table = "functions"
match = "C_SessionCancel"
status = "out-of-scope"
reason = "PKCS#11 3.0: no operation is left to cancel"

[[rule]]
table = "functions"
match = "C_GetSessionValidationFlags"
status = "out-of-scope"
reason = "PKCS#11 3.2 validation flags: provenance comes from the module and token info (LOCK.md)"

[[rule]]
table = "functions"
match = "C_WaitForSlotEvent"
status = "out-of-scope"
reason = "cakeys checks a token when asked, never waits for one"

[[rule]]
table = "functions"
match = "C_CloseAllSessions"
status = "out-of-scope"
reason = "cakeys closes the sessions it opened, one by one"

[[rule]]
table = "functions"
match = "C_GetSlotInfo"
status = "out-of-scope"
reason = "tokens are chosen by their token info (label, serial); the slot's own description is not used"

[[rule]]
table = "functions"
match = "C_*Object*"
status = "out-of-scope"
reason = "C_CopyObject, C_SetAttributeValue, C_GetObjectSize: cakeys identifies, creates and deletes objects, never copies or changes one"

[[rule]]
table = "functions"
match = "C_SetAttributeValue"
status = "out-of-scope"
reason = "cakeys never changes an object's attributes"

